<!--
  Orbit — era prototype III · THE SCROLL (China, Tang, c. 649–684 CE, after the Dunhuang star chart,
  British Library Or.8210/S.3326). Plan: docs/archive/eras/03-scroll.md, which until this page said
  "No prototype exists yet for this era". Not shipped. PROTOTYPES.md's table still says the same and
  is deliberately left as it is: this sheet was added without touching any existing file, so the
  verdict row is the author's to write once the page has been looked at in a hand.

  SECOND PASS, held to the shipped Renaissance atlas at 430×932. The first pass put the right things
  in the right places and drew them as a diagram — PROTOTYPES.md's standing finding about every first
  pass — and read thin beside the atlas in five named ways. What changed, point for point:
   · The page is framed. The atlas has a plate-mark and a graduated border numbered down both sides;
     this sheet has its own equivalents, all attested to the tradition rather than borrowed: the
     paper's two long edges, worn and browned, with the dark beyond them; the Heart's panel ruled in
     a graduated band whose ticks count polar distance (去極度) in dù and are numbered in Chinese
     numerals down both sides; the panel's head rule counting each mansion's own width in dù (房 five,
     心 five, 尾 eighteen), so three columns drawn alike carry visibly unequal scales, which is the
     whole point of a mansion; and round the circumpolar panel the twenty-eight mansions ruled out
     from the circle of perpetual visibility at their true unequal widths (summing to 365, with the
     quarter left over), named in the rim as the Suzhou planisphere names them.
   · Depth by layers, as the atlas lays its faint great circles under everything. Under the ink: the
     text on the scroll's other side showing through the thin sheet, mirrored — S.3326 is written on
     both faces — and the scribe's faint ruled text columns (界欄) under it; the soft fall of one lamp
     across the sheet. Then diluted ink (淡墨) for structure, and dense ink only for what was observed:
     "ink has five tones" is this hand's own name for layering.
   · Every mark from a tool. Stars are brush dots — the dot stroke (點) enters from the upper left,
     presses and turns, so it carries a direction and a pooled rim — in three pigments with three
     materials: pine soot with a faint glue sheen, cinnabar raised and granular with a darker margin,
     and chalk-pale pigment standing slightly proud of the sheet inside a hairline of ink. Wind and
     comet tails are no longer filled bands but separate hairs, each breaking independently: flying
     white as a brush actually leaves it. Three magnitudes of dot.
   · Typography is a system of three hands: LXGW WenKai TC in Medium for title, score and mansion
     names, Regular for captions, Light for glosses, numerals, the panel's text column and colophon.
   · Nothing is a placeholder: the ink resource is now on the sheet (a gilt-lettered ink-stick ground
     down at one end, 03-scroll.md's currency), the held ring carries its row number as the atlas's
     rings do, and a seam seal is stamped across the paste join, half on each sheet and a hair out of
     register, as seals were stamped across joins to show no sheet had been swapped.

  What the sheet is. One viewport of the scroll turned upright for a phone held in portrait, the way
  the game's rows climb: at the top the thirteenth, circumpolar panel — the signature sheet, the pole
  standing in for the emperor's fixed seat — half catalogued, dense where the Bureau's attention has
  fallen and bare everywhere it has not; then a paste join; then one equatorial panel, the Heart's,
  ruled into three mansions (房 · 心 · 尾), where a run is actually played. Below that the paper gives
  way: hundun.

  What it tests, in the order 03-scroll.md's "The prototype" section asks:
   · the sighting tube (窺管) — a bronze barrel laid on the flight's tangent with one armillary ring
     round it, the Observer Core at the forward aperture as the one pure light on the sheet. The aim
     guide ahead of it is pricked, never ruled, so the solid barrel and the dotted guide cannot fuse;
   · the dot → line → boundary reveal, driven by documented = clamp(orbitSweep/240°,0,1) exactly as
     KNOWLEDGE-HORIZON.md specifies, animated live on the held body — the gap PROTOTYPES.md names as
     the single most valuable prototype missing from this folder. At capture a hollow point; by a
     quarter-turn a brush line grows to the nearest neighbour; by half a turn the boundary closes and
     the group takes its school's colour; by two thirds the entry closes on a kaishu caption, or — when
     that school's colour has already been captioned this run — on a cinnabar seal. The held body
     cycles schools by encounter count, and so does the wet stroke drawn round it;
   · the ring graduated in dù, 365¼ to the circle, a tick every five, so the last division is a
     quarter of the rest — the year's odd quarter-day, a short gap at the top of the rim.

  Omens (03-scroll.md, Dangers — depiction only): 熒惑守心, Mars lingering at the Heart, a baleful red
  point whose rings draw inward; 彗星, the broom star, head and tail after the Mawangdui comet atlas's
  own drawn forms; 風角, the wind angle, dry brush with an eight-direction rosette — a practice-class,
  not an incident; 日食, sun-eating, a disc with a bite out of it.

  FACES — SIL Open Font License 1.1, cut by script to only the characters this page sets:
    fonts/lxgw-wenkai-tc-{light,regular,medium}.scroll.woff2  LXGW WenKai TC (© The LXGW WenKai
      Project Authors) — a kaishu book-hand in traditional forms. The era file names Noto Serif TC,
      a Ming/Song printing face, right in its forms but a woodblock register centuries later than the
      hand; WenKai TC is kaishu and traditional both, offered for the author to weigh.
    fonts/noto-serif-tc.scroll.woff2  Noto Serif TC (© Adobe, the Noto Project) — the small Latin of
      the L legend only, out-of-fiction chrome as on every other page in this folder.
  Seals would be cut in seal script (篆書); no OFL traditional seal-script face was in reach, so seals
  set kaishu reversed white out of cinnabar. A compromise, and the first thing to change.

  Sourcing, and what is unverified. Mansion widths are the traditional values (角12 亢9 氐15 房5 心5
  尾18 箕11 · 斗26 牛8 女12 虛10 危17 室16 壁9 · 奎16 婁12 胃14 昴11 畢16 觜2 參9 · 井33 鬼4 柳15 星7
  張18 翼18 軫17); Tang determinations differ by a degree here and there. Asterism names are standard;
  their positions are schematic, not plotted. The panel column 「自氐五度至尾九度為大火於辰在卯宋之分野」
  is the Jin shu treatise's formula for the Jupiter station Dahuo, the kind of text the Dunhuang
  panels carry; its wording has NOT been checked against S.3326's own panel. The verso show-through
  is mirrored and too faint to read, and is set from this page's own characters, not transcribed from
  the scroll's front. 司天監印, 沙州之印 (Shazhou, Dunhuang's Tang prefecture) and 志 are constructed
  seals; the colophon 「觀者 · 圖三 · 種四八二一」 is constructed (player / plate / seed, per the era
  file's colophon order). The sighting tube is a plausible reconstruction centuries later than the
  era's window, as the era file says.

  NOT ACHIEVED: the closing bowman is not on the sheet; the Suzhou stele's rubbed register is not
  tried; the tube's two armillary rings are one; there is no sound, no release on tap and no flight
  — a held orbit on loop, because the question it answers is what a held orbit looks like.
  Controls: L or a tap toggles the legend. ?t=SECONDS freezes the clock (for screenshots); ?legend

<canvas id="c"></canvas>
<script>
'use strict';
const T={paper:[216,199,155],ink:'#1E1A15',cin:'#B7312C',pale:'#E9E1CA',
  // ink has five tones: dense for what was observed, the paler ones for the ruling that holds it.
  ink2:'rgba(30,26,21,.62)',ink3:'rgba(44,36,26,.38)',ink4:'rgba(58,46,32,.2)',
  bronze:'#8C6B38',bronzeHi:'#D2AE6C',bronzeLo:'#4E3718',core:'#FFF7DC',dried:'#5A4C3C',cave:'#16110c',gilt:'#C9A24E',

const SCHOOL=[{name:'甘氏'},{name:'石氏'},{name:'巫咸'}];
const DW=430,DH=932,TAU=Math.PI*2,EDGE_L=5,EDGE_R=425;
const qs=new URLSearchParams(location.search);
const FROZEN=qs.has('t')?+qs.get('t'):null;
let showLegend=qs.has('legend');
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,dpr,k,ox,oy,paperC,inkC;

// A small seeded generator, so the same fibre and the same foxing sit in the same place every load.
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const lerp=(a,b,t)=>a+(b-a)*t,clamp=(v,a,b)=>v<a?a:v>b?b:v,ease=t=>t*t*(3-2*t);
function hash2(x,y,s){let h=Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(s,982451653)|0;h=Math.imul(h^h>>>13,1274126177);return((h^h>>>16)>>>0)/4294967296}
function vnoise(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  return lerp(lerp(hash2(xi,yi,s),hash2(xi+1,yi,s),u),lerp(hash2(xi,yi+1,s),hash2(xi+1,yi+1,s),u),v)*2-1}
function fbm(x,y,o,s){let a=0,m=.5,f=1;for(let i=0;i<o;i++){a+=vnoise(x*f,y*f,s+i*17)*m;m*=.5;f*=2.03}return a}
// The paper's two long edges: worn, never straight, a little further in where a hand held the sheet.
const edgeL=y=>EDGE_L+fbm(y/60,1,3,91)*2.4+fbm(y/7,2,2,92)*.7,edgeR=y=>EDGE_R+fbm(y/60,5,3,93)*2.4+fbm(y/7,6,2,94)*.7;

/* ================= the ground: aged hemp paper ================= */
// The colour fields are baked at a quarter of the device resolution and smoothed up, because mottle and
// formation cloud are broad; the tooth, the laid lines and the fibres are then laid at full resolution
// over it, since those are what a quarter-scale bake would smear into fog — the Rock's lesson, that a
// baked ground is drawn at its native resolution or is not worth baking.
function bakePaper(){
  const c=document.createElement('canvas');c.width=W*dpr;c.height=H*dpr;let g=c.getContext('2d');
  const q=4,lw=Math.ceil(c.width/q),lh=Math.ceil(c.height/q),lo=document.createElement('canvas');lo.width=lw;lo.height=lh;
  const lg=lo.getContext('2d'),im=lg.createImageData(lw,lh),d=im.data;
  for(let y=0;y<lh;y++)for(let x=0;x<lw;x++){
    const X=(x*q/dpr-ox)/k,Y=(y*q/dpr-oy)/k,i=(y*lw+x)*4;
    const m=fbm(X/140,Y/140,4,11),cl=fbm(X/22,Y/26,3,29),ck=Math.sin(Y/58+fbm(X/200,Y/200,2,5)*2.4);
    // One lamp, above and a little right of the held body: the sheet is lit where it is read and
    // falls away toward its edges, the way the atlas's plate is lit.
    const lx=(X-230)/300,ly=(Y-430)/620,lamp=1.04-Math.min(1,lx*lx+ly*ly)*.16;
    // Handled edges brown; the centre keeps a little of the fresh tone the paper started at.
    const eL=edgeL(Y),eR=edgeR(Y),ed=Math.min(X-eL,eR-X),br=clamp(1-ed/26,0,1);
    const l=(1+m*.075+cl*.04+ck*.016)*lamp;
    let r=T.paper[0]*l*(1-br*.1),gg=T.paper[1]*l*(1-br*.17),b=T.paper[2]*l*(1-br*.3);
    if(ed<0){const n=.8+fbm(X/9,Y/9,2,4)*.25;r=22*n;gg=17*n;b=12*n}
    d[i]=r;d[i+1]=gg;d[i+2]=b;d[i+3]=255}
  lg.putImageData(im,0,0);g.imageSmoothingQuality='high';g.drawImage(lo,0,0,c.width,c.height);
  // Tooth, laid lines and chain ties at full resolution. A Tang mould was a bamboo screen, so the laid
  // lines are the strips' own close ribbing and the chain lines the threads that tied them, far apart.
  const fi=g.getImageData(0,0,c.width,c.height),fd=fi.data,cw=c.width;
  for(let y=0;y<c.height;y++){const Y=(y/dpr-oy)/k,chain=Math.abs(((Y%36)+36)%36-18)<.55?-.022:0,eL=edgeL(Y),eR=edgeR(Y);
    for(let x=0;x<cw;x++){const X=(x/dpr-ox)/k;if(X<eL||X>eR)continue;const laid=Math.sin(X/2.3*Math.PI)*.012,t=(hash2(x,y,3)-.5)*.05;
      const f=1+laid+chain+t,i=(y*cw+x)*4;fd[i]*=f;fd[i+1]*=f;fd[i+2]*=f}}
  g.putImageData(fi,0,0);
  g.setTransform(dpr*k,0,0,dpr*k,dpr*ox,dpr*oy);const R=rng(7);
  g.save();g.beginPath();g.moveTo(edgeL(-200),-200);for(let y=-200;y<=DH+200;y+=4)g.lineTo(edgeL(y),y);for(let y=DH+200;y>=-200;y-=4)g.lineTo(edgeR(y),y);g.closePath();g.clip();
  // The verso, showing through. The scroll is written on both faces and the sheet is thin, so the
  // other side's columns read here reversed, soft, and brown rather than black; under them the faint
  // ruled column lines the other scribe wrote between.
  // Set on a layer of its own and blurred once, since a filter on every character would be a full
  // blur pass per character — seconds of work at a phone's pixel density.
  const vc=document.createElement('canvas');vc.width=c.width;vc.height=c.height;const vg=g;g=vc.getContext('2d');
  g.setTransform(dpr*k,0,0,dpr*k,dpr*ox,dpr*oy);g.save();g.translate(DW,0);g.scale(-1,1);
  const pool=[...'自氐五度至尾九度為大火於辰在卯宋之分野天文圖觀者北極紫微垣華蓋心房尾東咸天江傅說鍵閉罰甘氏石氏巫咸彗星風角日食熒惑守'];
  for(let cx=34;cx<DW-20;cx+=19){g.strokeStyle='rgba(90,64,34,.035)';g.lineWidth=.5;g.beginPath();g.moveTo(cx-9.5,60);g.lineTo(cx-9.5,860);g.stroke();
    let y=60+R()*40;while(y<850){const run=4+R()*22|0;g.font=kai(11,'l');g.textAlign='center';g.textBaseline='middle';g.fillStyle=`rgba(80,54,26,${.045+R()*.035})`;
      for(let i=0;i<run&&y<850;i++){g.fillText(pool[R()*pool.length|0],cx,y);y+=12.4}y+=18+R()*80}}
  g.restore();g=vg;g.save();g.setTransform(1,0,0,1,0,0);g.filter=`blur(${(.9*dpr*k).toFixed(2)}px)`;g.drawImage(vc,0,0);g.restore();
  // Fibres: many short strands, a few long hemp ones, some lighter than the sheet and some darker.
  for(let i=0;i<2600;i++){const x=R()*DW,y=R()*DH,a=R()*TAU,L=3+R()*11,cu=(R()-.5)*.6,lt=R()<.55;
    g.strokeStyle=lt?`rgba(246,236,206,${.12+R()*.16})`:`rgba(120,92,52,${.06+R()*.1})`;g.lineWidth=.25+R()*.4;
    g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+Math.cos(a+cu)*L*.5,y+Math.sin(a+cu)*L*.5,x+Math.cos(a)*L,y+Math.sin(a)*L);g.stroke()}
  for(let i=0;i<70;i++){const x=R()*DW,y=R()*DH,a=R()*TAU,L=30+R()*70;g.strokeStyle=`rgba(${R()<.5?'250,242,214':'110,84,46'},${.08+R()*.08})`;
    g.lineWidth=.35+R()*.3;g.beginPath();g.moveTo(x,y);g.bezierCurveTo(x+Math.cos(a)*L*.3+(R()-.5)*14,y+Math.sin(a)*L*.3+(R()-.5)*14,
      x+Math.cos(a)*L*.7+(R()-.5)*14,y+Math.sin(a)*L*.7+(R()-.5)*14,x+Math.cos(a)*L,y+Math.sin(a)*L);g.stroke()}
  // Foxing: iron in the sheet rusting out as brown spots, each with a darker core.
  for(let i=0;i<30;i++){const x=R()*DW,y=R()*DH*.94,r=1.5+R()*R()*9,gr=g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,`rgba(128,82,38,${.16+R()*.18})`);gr.addColorStop(.5,`rgba(150,104,52,${.07+R()*.07})`);gr.addColorStop(1,'rgba(150,104,52,0)');
    g.fillStyle=gr;g.beginPath();g.ellipse(x,y,r,r*(.7+R()*.5),R()*TAU,0,TAU);g.fill()}
  // Old water tide-lines, pale rings with a browned margin.
  for(let i=0;i<3;i++){const x=R()*DW,y=100+R()*700,r=24+R()*40;g.strokeStyle='rgba(140,100,50,.09)';g.lineWidth=1.2;
    g.beginPath();for(let j=0;j<=48;j++){const a=j/48*TAU,rr=r*(1+fbm(Math.cos(a)*2+i,Math.sin(a)*2,2,40)*.35);j?g.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr):g.moveTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}g.stroke()}
  // The paste join: the upper sheet laps the lower by a few pixels, the paste has darkened the lap,
  // and the upper sheet's cut edge catches a line of light where it stands proud.
  const sy=SEAM;g.fillStyle='rgba(120,86,40,.11)';g.beginPath();g.moveTo(-40,sy);
  for(let x=-40;x<=DW+40;x+=6)g.lineTo(x,sy+fbm(x/30,1,2,61)*1.2);for(let x=DW+40;x>=-40;x-=6)g.lineTo(x,sy+6+fbm(x/24,4,2,62)*1.6);g.fill();
  g.strokeStyle='rgba(90,64,30,.28)';g.lineWidth=.7;g.beginPath();for(let x=-40;x<=DW+40;x+=4){const yy=sy+6.2+fbm(x/24,4,2,62)*1.6;x>-40?g.lineTo(x,yy):g.moveTo(x,yy)}g.stroke();
  g.strokeStyle='rgba(250,242,216,.45)';g.lineWidth=.5;g.beginPath();for(let x=-40;x<=DW+40;x+=4){const yy=sy+7+fbm(x/24,4,2,62)*1.6;x>-40?g.lineTo(x,yy):g.moveTo(x,yy)}g.stroke();
  g.restore();
  // The long edges themselves: a darker worn margin, a lit lip, and loose fibres over the dark.
  for(const side of[-1,1]){const E=side<0?edgeL:edgeR;g.strokeStyle='rgba(96,66,32,.35)';g.lineWidth=1;g.beginPath();for(let y=-10;y<=DH+10;y+=3){const x=E(y)-side*1.1;y>-10?g.lineTo(x,y):g.moveTo(x,y)}g.stroke();
    g.strokeStyle='rgba(248,236,204,.4)';g.lineWidth=.45;g.beginPath();for(let y=-10;y<=DH+10;y+=3){const x=E(y)-side*.3;y>-10?g.lineTo(x,y):g.moveTo(x,y)}g.stroke();
    for(let i=0;i<260;i++){const y=R()*DH,x=E(y),a=(side<0?Math.PI:0)+(R()-.5)*1.4,L=1+R()*R()*6;g.strokeStyle=`rgba(${205+R()*25|0},${184+R()*22|0},${140+R()*22|0},${.3+R()*.4})`;
      g.lineWidth=.25+R()*.3;g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*L,y+Math.sin(a)*L);g.stroke()}}
  return c}

/* ================= the brush ================= */
function samp(f,n){const p=[];for(let i=0;i<=n;i++)p.push(f(i/n));return p}
function lineP(a,b,n=12){return samp(t=>({x:lerp(a.x,b.x,t),y:lerp(a.y,b.y,t)}),n)}
function curveP(a,c,b,n=24){return samp(t=>({x:(1-t)*(1-t)*a.x+2*(1-t)*t*c.x+t*t*b.x,y:(1-t)*(1-t)*a.y+2*(1-t)*t*c.y+t*t*b.y}),n)}
function arcP(cx,cy,r,a0,a1,n=40){return samp(t=>{const a=lerp(a0,a1,t);return{x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r}},n)}
function cut(pts,f){if(f>=1)return pts;const n=Math.max(1,Math.round((pts.length-1)*f));return pts.slice(0,n+1)}
// A little wobble along a ruled line, since a brush held to a straight-edge still is not one.
function wob(pts,amt,s){return pts.map((p,i)=>{const t=i/(pts.length-1),n=vnoise(t*5,0,s)*amt;return{x:p.x+n,y:p.y+vnoise(t*5,3,s)*amt}})}
// One stroke of a loaded brush: pressed in fat where it touches down, lifted thin, the ink feathering
// into the sheet a little wider than the stroke itself, and — when `dry` — its tail breaking into the
// separate hairs of flying white as the load runs out. `bleed` uses the canvas blur filter and so is
// for the baked layer only; nothing drawn every frame asks for it.
function brush(g,pts,o){
  const n=pts.length;if(n<2)return;const R=rng(o.seed||1),ph=R()*9,w=o.w||1,col=o.col||T.ink,a=o.a??.92,press=o.press??.55,lift=o.lift??.3,dry=o.dry?(o.dryAt??.72):1.01;
  const L=[0];for(let i=1;i<n;i++)L.push(L[i-1]+Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y));const TL=L[n-1]||1;
  const wid=i=>{const t=L[i]/TL;return w*(1+press*Math.exp(-t*9))*(t>.7?1-(1-lift)*((t-.7)/.3):1)*(1+.13*Math.sin(t*21+ph)+.06*Math.sin(t*57+ph*2))};
  const nor=i=>{const p=pts[Math.max(0,i-1)],q=pts[Math.min(n-1,i+1)],dx=q.x-p.x,dy=q.y-p.y,l=Math.hypot(dx,dy)||1;return{x:-dy/l,y:dx/l}};
  const poly=(sc,upto)=>{g.beginPath();const idx=[];for(let i=0;i<n&&L[i]/TL<=upto;i++)idx.push(i);if(idx.length<2)return false;
    for(const i of idx){const m=nor(i),h=wid(i)*sc/2;g.lineTo(pts[i].x+m.x*h,pts[i].y+m.y*h)}
    for(let j=idx.length-1;j>=0;j--){const i=idx[j],m=nor(i),h=wid(i)*sc/2;g.lineTo(pts[i].x-m.x*h,pts[i].y-m.y*h)}g.closePath();return true};
  g.save();g.fillStyle=col;g.strokeStyle=col;
  if(o.bleed&&'filter'in g){g.filter=`blur(${(.6*w).toFixed(2)}px)`;g.globalAlpha=a*.22;if(poly(1.9,dry))g.fill();g.filter='none'}
  g.globalAlpha=a;if(poly(1,dry))g.fill();

  g.save();g.lineCap='round';
  for(let i=1;i<pts.length;i++){const f=i/pts.length;g.globalAlpha=.15+f*.75;
    g.strokeStyle=school===0?T.ink:school===1?T.cin:T.pale;g.lineWidth=.9+f*1.2;g.beginPath();g.moveTo(pts[i-1].x,pts[i-1].y);g.lineTo(pts[i].x,pts[i].y);g.stroke();
    if(school===2){g.strokeStyle=T.ink;g.lineWidth=.3;g.globalAlpha*=.7;for(const sd of[-1,1]){const a=Math.atan2(pts[i].y-F.y,pts[i].x-F.x),o=sd*((.9+f*1.2)/2+.1);
      g.beginPath();g.moveTo(pts[i-1].x+Math.cos(a)*o,pts[i-1].y+Math.sin(a)*o);g.lineTo(pts[i].x+Math.cos(a)*o,pts[i].y+Math.sin(a)*o);g.stroke()}}}
  // the gloss on the wet ink, a hairline of light riding the stroke's inner edge near the brush.
  g.strokeStyle='rgba(255,248,226,.55)';g.lineWidth=.35;g.beginPath();arcP(F.x,F.y,F.R-2.1,st.th-Math.min(span,.9),st.th-.25,12).forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));g.stroke();
  g.restore()}
// The traveller: an armillary sighting tube laid on the flight's own tangent — a cast bronze barrel with
// raised collars and the fine lengthwise hatching of its finish, one graduated ring round it seen nearly
// edge-on, and the Observer Core at its forward aperture, the one pure light on the sheet. Ahead of it
// the aim guide is pricked, never ruled.
function drawTube(g,th,t){
  const S=1.2,p={x:F.x+Math.cos(th)*(F.R-1.6),y:F.y+Math.sin(th)*(F.R-1.6)},h=th+Math.PI/2,d={x:Math.cos(h),y:Math.sin(h)};
  const ap={x:p.x+d.x*14*S,y:p.y+d.y*14*S};
  g.save();
  for(let i=1;i<=12;i++){const q=7+i*7;g.globalAlpha=.8*(1-i/14);g.fillStyle=T.ink;g.beginPath();g.arc(ap.x+d.x*q,ap.y+d.y*q,i<3?1:.8,0,TAU);g.fill()}
  g.globalAlpha=1;g.translate(p.x,p.y);g.rotate(h);g.scale(S,S);
  // a soft shadow the instrument throws on the sheet, so it sits above the paper and not in it.
  g.fillStyle='rgba(40,28,14,.1)';g.beginPath();g.ellipse(-2,2.2,15,3.6,0,0,TAU);g.fill();
  const ring=(back)=>{const a0=back?Math.PI/2:-Math.PI/2,a1=back?Math.PI*1.5:Math.PI/2;g.save();g.translate(-2,0);
    g.strokeStyle=T.bronzeLo;g.lineWidth=2.3;g.beginPath();g.ellipse(0,0,3.3,11.8,0,a0,a1);g.stroke();
    g.strokeStyle=back?T.bronze:T.bronzeHi;g.lineWidth=1.3;g.beginPath();g.ellipse(0,0,3.3,11.8,0,a0,a1);g.stroke();
    g.strokeStyle='rgba(30,26,21,.8)';g.lineWidth=.35;for(let i=0;i<=12;i++){const a=a0+i/12*Math.PI;g.beginPath();g.moveTo(Math.cos(a)*2.3,Math.sin(a)*10.8);g.lineTo(Math.cos(a)*4.3,Math.sin(a)*12.8);g.stroke()}g.restore()};
  ring(true);
  const bg=g.createLinearGradient(0,-4,0,4);bg.addColorStop(0,T.bronzeHi);bg.addColorStop(.3,T.bronze);bg.addColorStop(.75,T.bronzeLo);bg.addColorStop(1,'#3a2810');
  g.fillStyle=bg;g.beginPath();g.moveTo(-17,-3.9);g.lineTo(13,-2.8);g.lineTo(13,2.8);g.lineTo(-17,3.9);g.closePath();g.fill();
  g.save();g.clip();g.strokeStyle='rgba(40,26,8,.35)';g.lineWidth=.22;for(let y=-3.4;y<3.6;y+=.9){g.beginPath();g.moveTo(-17,y);g.lineTo(13,y*.74);g.stroke()}g.restore();
  g.strokeStyle='rgba(30,26,21,.9)';g.lineWidth=.6;g.beginPath();g.moveTo(-17,-3.9);g.lineTo(13,-2.8);g.lineTo(13,2.8);g.lineTo(-17,3.9);g.closePath();g.stroke();
  // raised collars, each lit on its upper face.
  for(const x of[-13,-4,7]){const hh=3.9-(x+17)*.037+.6;g.fillStyle=T.bronzeLo;g.fillRect(x-.9,-hh,1.8,hh*2);g.fillStyle=T.bronzeHi;g.fillRect(x-.9,-hh,1.8,.7);g.strokeStyle='rgba(30,26,21,.8)';g.lineWidth=.3;g.strokeRect(x-.9,-hh,1.8,hh*2)}
  g.fillStyle='#2a1c0a';g.beginPath();g.ellipse(-17,0,1.2,3.9,0,0,TAU);g.fill();g.stroke();
  ring(false);
  g.restore();
  // The Core: a warm white point in a soft halo at the aperture's lip, breathing very slightly.
  const br=1+.08*Math.sin(t*2.1);g.save();const hg=g.createRadialGradient(ap.x,ap.y,0,ap.x,ap.y,11*br);hg.addColorStop(0,'rgba(255,250,228,.95)');hg.addColorStop(.3,'rgba(255,244,206,.55)');hg.addColorStop(1,'rgba(255,244,206,0)');
  g.fillStyle=hg;g.beginPath();g.arc(ap.x,ap.y,11*br,0,TAU);g.fill();g.fillStyle=T.core;g.beginPath();g.arc(ap.x,ap.y,2.5,0,TAU);g.fill();
  g.strokeStyle=T.bronzeLo;g.lineWidth=.8;g.beginPath();g.arc(ap.x,ap.y,3.4,0,TAU);g.stroke();g.restore();
  return{p,ap}}
function drawMars(g,t){
  // Mars guarding the Heart: rings of dilute cinnabar that close in on the point and are taken by it —
  // a pull that does not let go, the opposite gesture from the comet's tail sweeping outward.
  g.save();for(let i=0;i<3;i++){const f=((t*.28+i/3)%1),r=6+(1-f)*26;g.globalAlpha=f*.5;g.strokeStyle=T.cin;g.lineWidth=.55+f*.5;g.beginPath();g.arc(MARS.x,MARS.y,r,0,TAU);g.stroke()}g.restore()}

/* ================= L — the legend: modern words over a sheet that has none ================= */
const LEG=[
  [0,0,'traveller — sighting tube 窺管, Core at aperture',176,574],
  [F.x-30,F.y+22,'held body — dot, line, boundary, then caption or seal, by documented',30,680],
  [F.x-42,F.y+42,'ring — capture radius, graduated in dù (365¼)',30,694],
  [REL.a0!==null?F.x+Math.cos((REL.a0+REL.a1)/2)*(F.R+9):F.x,REL.a0!==null?F.y+Math.sin((REL.a0+REL.a1)/2)*(F.R+9):F.y,'release band + best release (pale disc)',30,544],
  [NEXT.x,NEXT.y,'next body — a phenomenon: a point, no identity',30,430],
  [MARS.x,MARS.y,'attractor — 熒惑守心, Mars lingering at the Heart',150,516],
  [COMET.x,COMET.y-30,'repulsor — 彗星, broom star',250,602],
  [WIND.x0+40,WIND.y0+16,'crosswind — 風角, the wind angle (a practice)',90,748],
  [ECL.x,ECL.y,'obscurer — 日食, sun-eating',200,774],
  [BODIES[0].x,BODIES[0].y,'catalogued + captioned (甘氏, black)',30,840],
  [BODIES[1].x+34,BODIES[1].y+24,'catalogued, seal (colour already captioned)',150,856],
  [BODIES[2].x,BODIES[2].y,'joined, not yet coloured',30,664],
  [MOON.x,MOON.y,'the Moon (月)',300,438],
  [114,702,'dried route',60,764],
  [DW/2,893,'the boundary — 混沌 hundun: the paper failing',110,914],
  [24,60,'score, in dù',60,64],[46,60,'best (最)',60,78],[190,21,'ink (墨) — the stick, ground down',150,40],
  [C0.x,C0.y+10,'chart — circumpolar panel, half catalogued',96,266],
  [C0.x-R0*.6,C0.y-R0*.8+6,'28 mansions at their widths in dù',70,96],
  [404,60,'title 天文圖, seal, colophon',236,56],
  [70,SEAM+3,'seam seal across the paste join',84,380],
  [PANEL.x0+6,500,'polar distance, in dù',30,488],
  [200,PANEL.y0+5,'mansion widths across the head',150,452],
  [34,300,'cloud-qi, ghosted',48,330],
  [F.x,F.y-F.R-2,'the ¼-dù division',160,532]];
function drawLegend(g,tube){
  LEG[0][0]=tube.ap.x;LEG[0][1]=tube.ap.y;g.save();g.font=gloss(9.5);g.textBaseline='middle';g.lineWidth=.6;
  for(const[x,y,s,lx,ly]of LEG){const w=g.measureText(s).width;g.strokeStyle=T.legend;g.globalAlpha=.8;g.beginPath();g.moveTo(x,y);g.lineTo(clamp(x,lx,lx+w),ly);g.stroke();
    g.beginPath();g.arc(x,y,1.6,0,TAU);g.fillStyle=T.legend;g.fill();g.globalAlpha=1;g.fillStyle=T.legendBg;g.fillRect(lx-3,ly-7,w+6,14);g.fillStyle=T.legend;g.fillText(s,lx,ly)}
  g.fillStyle=T.legendBg;g.fillRect(96,2,238,12);g.fillStyle=T.legend;g.fillText('L or tap: legend · ?t=seconds freezes the clock',100,8.5);g.restore()}

function frame(now){
  const t=FROZEN!==null?FROZEN:(now-t0)/1000;
  ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(paperC,0,0);ctx.drawImage(inkC,0,0);
  ctx.setTransform(dpr*k,0,0,dpr*k,dpr*ox,dpr*oy);
  drawMars(ctx,t);
  const{st,school}=drawFocus(ctx,t);
  drawTrail(ctx,st,school);
  const tube=drawTube(ctx,st.th,t);
  if(showLegend)drawLegend(ctx,tube);
  if(FROZEN===null)requestAnimationFrame(frame)}

function resize(){
  dpr=Math.min(3,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;
  k=Math.min(W/DW,H/DH);ox=(W-DW*k)/2;oy=(H-DH*k)/2;
  paperC=bakePaper();inkC=bakeInk();
  if(FROZEN!==null)requestAnimationFrame(frame)}
addEventListener('keydown',e=>{if(e.key==='l'||e.key==='L'){showLegend=!showLegend;if(FROZEN!==null)requestAnimationFrame(frame)}});
cv.addEventListener('pointerdown',()=>{showLegend=!showLegend;if(FROZEN!==null)requestAnimationFrame(frame)});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(resize,150)});
// Canvas text never triggers a lazy @font-face load, so every face is loaded by hand before the first
// bake; if one fails the sheet still draws, in whatever CJK serif the system has.
Promise.all([['KaiL','light'],['Kai','regular'],['KaiM','medium']].map(([f,w])=>[f,`fonts/lxgw-wenkai-tc-${w}.scroll.woff2`]).concat([['Gloss','fonts/noto-serif-tc.scroll.woff2']])
  .map(([f,u])=>new FontFace(f,`url(${u})`).load().then(ff=>document.fonts.add(ff)).catch(()=>{})))
  .then(()=>{resize();if(FROZEN===null)requestAnimationFrame(frame)});
</script>
