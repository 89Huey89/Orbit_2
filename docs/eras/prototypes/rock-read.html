<!doctype html>
<!--
  Orbit — Stage 2 readability prototype for Era I, The Rock (docs/eras/JOURNEY.md §7, "Stage 2 — the
  Prehistory readability prototype"). This is not a repaint of rock.html's signature sheet: that page
  is a still panel proving the material reads as a cave wall. This page is a loop — a traveller flies,
  is taken into orbit, sweeps, and releases on a tap onto the tangent that orbit was building — because
  the only question worth spiking here is whether ochre, charcoal and a pecked hollow can carry the
  seven things a player must read *while the world will not wait for them to finish reading*:

    1. the target phenomenon   — which body is worth flying at right now
    2. the capture region      — where the orbit will actually take hold
    3. weak vs bright          — a body worth more, drawn as more (never as a number)
    4. the traveller           — the player's own position
    5. the trajectory          — where release, this instant, would send them
    6. danger                  — the Shaft and the Flare, exactly as 01-rock.md names them
    7. documentation           — how much of orbitSweep this body has actually been paid

  Grammar ported from the shipped game, kept rough on purpose (src/simulation.js, src/reveal.js):
  a body has a radius `r` and a capture radius `cap`; a captured traveller circles it at a fixed
  radius, `angle` advancing at `speed/rad` and `orbitSweep` accumulating with it; release keeps
  whatever `vx,vy` the orbit already had at that instant — positionPlayer()'s own tangent formula,
  `vx=-sin(angle)*speed*dir, vy=cos(angle)*speed*dir` — copied verbatim below, because the whole
  point of this sheet dies if the release doesn't actually leave on the tangent. `SWEEP_FULL=TAU*2/3`
  and `n.documented=clamp(orbitSweep/SWEEP_FULL,0,1)` are copied the same way, read live while a body
  is held and frozen the instant it is released (src/reveal.js's own two-clock rule). The chart scrolls
  by easing a camera toward the traveller and drawing everything at `worldY-scrollY`; a darkness
  boundary sits some distance behind and rises to meet whoever stalls, exactly the shape the shipped
  game's `floorY` takes, with none of its exact constants.

  What is deliberately NOT ported: hazards do not bend the flight (src/simulation.js's `bendVelocity`
  is a whole field-and-turn system and answering "does danger read" does not need it — a straight
  release past a wrongly-read hazard is exactly as fatal as a curved one, and simpler to reason about
  here); orbit speed is not preserved from arrival, magnitudes are three flat tiers rather than a
  continuous scale, and there is no score, streak, ink or chapter. None of that is the question this
  page was asked to answer.

  Materials: ochre, charcoal, manganese, kaolin — the exact hexes 01-rock.md's Palette table names,
  laid on a real wall. The first pass of this page drew them on a near-black rectangle, which answers
  an easier question than the one the era actually poses: whether ochre reads is not in doubt, whether
  ochre reads *on lit limestone*, where the ground is already warm and already broken, is the whole
  risk. So the wall is here — a six-octave height field baked at full resolution and shaded from its
  own gradient against one torch held low and left, with the dark biting in from every edge, ported in
  spirit from rock.html and made to tile so it can scroll. Three primitives stand in for the shipped
  game's stroke work, simplified from rock.html's own:
    dab      — a pad of wet pigment pressed and lifted, no direction, no leading edge.
    scratch  — a flint incision: a pale core with a dark shadow thrown to one side.
    peck     — a small pecked hollow, a rim struck up around a dark pit.
  No `ctx.font` reaches the canvas except inside the L legend, which is out-of-fiction chrome exactly
  as it is on every other page in this folder, and inside the D diagnostic, which draws in shapes only
  (circle, arrow, bar) and sets no text at all. Nothing else on the play surface is a letter or digit.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Without this a phone lays the page out at 980 CSS pixels and scales the result down, which is
     how a sheet meant to be held in a hand ends up an unreadable strip. -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Rock — readability prototype</title>
<style>
  :root{color-scheme:dark}
  html,body{margin:0;height:100%;background:#050403;overflow:hidden;touch-action:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;box-shadow:0 0 90px 22px rgba(0,0,0,.85);cursor:crosshair}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
'use strict';
/* ---------- small shared utilities ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
function hexa(h,a){const n=parseInt(h.slice(1),16);return'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+Math.max(0,a)+')';}
function hexLerp(h0,h1,t,a){const n0=parseInt(h0.slice(1),16),n1=parseInt(h1.slice(1),16);
  const r=lerp(n0>>16&255,n1>>16&255,t),g=lerp(n0>>8&255,n1>>8&255,t),b=lerp(n0&255,n1&255,t);
  return'rgba('+(r|0)+','+(g|0)+','+(b|0)+','+Math.max(0,a)+')';}

/* ---------- tokens: the real ground pigments, 01-rock.md's own Palette table ---------- */
const T={
  redOchre:'#9C3B22', ochre:'#C9962E', ochreDeep:'#A9701F',
  manganese:'#211F1E', charcoal:'#2C2622', kaolin:'#EAE1CF',
  ember:'#FFC97A', flare:'#E45A20', legend:'rgba(176,206,222,.92)'
};

/* ---------- the game's own grammar, copied, not reinvented ---------- */
const SWEEP_FULL=TAU*2/3;              // src/simulation.js:12 — the same 240 degrees
const BASE_SPEED=232;                  // rough stand-in for src/simulation.js's BASE_SPEED
// positionPlayer()'s own formula (src/simulation.js:519-522), unmodified: an orbiting body's
// velocity at any instant is the tangent at its current angle. Everything about whether the release
// signal is fair rides on this one line being exactly what the shipped game does.
function tangentVX(angle,speed,dir){return -Math.sin(angle)*speed*dir;}
function tangentVY(angle,speed,dir){return  Math.cos(angle)*speed*dir;}

/* ---------- canvas plumbing (rock.html's own fit(), unchanged) ---------- */
let W=960,H=600,LEAD=372,XR=340;
const cv=document.getElementById('c'),ctx=cv.getContext('2d',{alpha:false});
let DPR=1;
// The sheet is the whole viewport rather than a fixed landscape panel, because this page's whole
// purpose now is to be held in a hand: a phone upright gets a tall wall to climb rather than a
// letterboxed strip across the middle of a black page. The wall tile is a fixed size and simply
// repeats to cover whatever it is given; the torch is baked in view space and so is rebuilt here.
function fit(){
  DPR=Math.max(1,Math.min(2,window.devicePixelRatio||1));
  W=Math.max(320,Math.min(1280,Math.round(window.innerWidth)));
  H=Math.max(400,Math.min(1500,Math.round(window.innerHeight)));
  cv.style.width=W+'px';cv.style.height=H+'px';
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  LEAD=H*.62;XR=Math.max(80,Math.min(340,W*.5-96));
  if(TORCH)bakeTorch();
}
window.addEventListener('resize',fit);

/* ================= THE WALL: a scrolling limestone face, lit by one torch =================
   The first pass of this page drew the marks on a near-black rectangle, which quietly answered an
   easier question than the one Stage 2 asks. The era's own risk is not whether ochre reads — it is
   whether ochre reads *on rock*, where the ground is already warm, already broken, and already
   taking most of the light. So the wall is here, ported in spirit from rock.html: limestone is not
   a texture over a colour, it is a shape, and the shading, the staining and the sheen are all read
   off one height field.

   Two things differ from that still panel, because this one scrolls. The field's lattice wraps in
   both axes, so the baked tile repeats seamlessly and the wall can be drawn twice at a modulo
   offset instead of being rebuilt as the camera climbs. And the torch is fixed in the view rather
   than in the world: this era's frame is the end of the torch's reach, and a light left behind in
   world space would simply slide off the top of the sheet. It stands low and a little left, as it
   does on the signature sheet, so the corners of the play field die exactly the way the era says
   they must — which is the honest version of the readability test, not a kinder one. */
const NW=960,NH=900,TILEW=960,TILEH=900;   // the field is baked at full resolution: a wall upscaled is a fog
const ss=t=>t*t*(3-2*t);
function octave(arr,cx,cy,amp,seed){
  const gw=NW/cx,gh=NH/cy,rnd=mulberry32(seed),lat=new Float32Array(gw*gh);
  for(let i=0;i<lat.length;i++)lat[i]=rnd();
  // The lattice is indexed modulo its own width and height, which is the whole reason the baked
  // tile can be drawn twice at a scroll offset without a seam showing across the wall.
  for(let y=0;y<NH;y++){const fy=y/cy,iy=fy|0,ty=ss(fy-iy),y0=(iy%gh)*gw,y1=((iy+1)%gh)*gw;
    for(let x=0;x<NW;x++){const fx=x/cx,ix=fx|0,tx=ss(fx-ix),x0=ix%gw,x1=(ix+1)%gw;
      const t=lat[y0+x0]+(lat[y0+x1]-lat[y0+x0])*tx,b=lat[y1+x0]+(lat[y1+x1]-lat[y1+x0])*tx;
      arr[y*NW+x]+=amp*(t+(b-t)*ty);}}}
function build(specs){const a=new Float32Array(NW*NH);
  for(const o of specs)octave(a,o[0],o[1],o[2],o[3]);
  let lo=1e9,hi=-1e9;for(let i=0;i<a.length;i++){if(a[i]<lo)lo=a[i];if(a[i]>hi)hi=a[i];}
  const k=1/(hi-lo||1);for(let i=0;i<a.length;i++)a[i]=(a[i]-lo)*k;return a;}
/* The bulges and hollows a painter worked with, from room-sized swells down to a hand's breadth;
   then the calcite, stretched vertically because water has run down this wall for a long time; then
   the iron staining, broad and slow, which is why a limestone face is never one colour. Every cell
   size divides the tile exactly, so each octave closes on itself and the wall repeats without a seam. */
const HF=build([[320,300,1,101],[192,180,.42,202],[120,100,.17,303],[64,60,.07,404],[24,20,.028,505],[12,10,.012,606]]);
const CF=build([[192,900,1,707],[64,300,.45,808],[24,100,.2,909]]);
const SF=build([[320,900,1,1010],[192,300,.4,1111]]);
let WALL=null;
function bakeWall(){
  const c=document.createElement('canvas');c.width=NW;c.height=NH;
  const g=c.getContext('2d'),img=g.createImageData(NW,NH),d=img.data;
  // One torch, low and to the left of the sheet, so a flank that faces it is lit and a flank that
  // turns away goes cold. The normal comes straight off the field's own gradient, and the tooth is
  // a hash of the pixel's own coordinates — limestone is never smooth at the scale a mark sits on.
  const LX=-.62,LY=.60;
  for(let y=0;y<NH;y++)for(let x=0;x<NW;x++){
    const i=y*NW+x,xm=(x+NW-1)%NW,xp=(x+1)%NW,ym=((y+NH-1)%NH)*NW,yp=((y+1)%NH)*NW;
    const gx=(HF[y*NW+xp]-HF[y*NW+xm])*.5,gy=(HF[yp+x]-HF[ym+x])*.5;
    const tooth=(((x*73856093^y*19349663)>>>8)&255)/255-.5;
    const lam=clamp((-gx*LX-gy*LY)*46+.54+HF[i]*.30+tooth*.03,.06,1.28);
    const iron=SF[i],cal=CF[i];
    const r=(158+iron*44+cal*20)*lam,gc=(143+iron*20+cal*22)*lam,b=(118-iron*22+cal*26)*lam;
    const o=i*4;d[o]=Math.min(255,r);d[o+1]=Math.min(255,gc);d[o+2]=Math.min(255,b);d[o+3]=255;
  }
  g.putImageData(img,0,0);WALL=c;
}
bakeWall();
/* The torch's reach, baked once in view space: the fall of one flame low and left, and the dark
   biting in from every edge. It is multiplied over the wall AND over everything drawn on it,
   because a mark on a cave wall is not lit separately from the wall it is on. The ambient floor is
   deliberately mean — a wall keeps a little light where the flame has stopped carrying, but only a
   little, and how little is exactly the question this sheet was built to put in front of an eye. */
let TORCH=null;
function bakeTorch(){
  const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
  g.fillStyle='rgb(36,31,27)';g.fillRect(0,0,W,H);
  const tx=W*.44,ty=H*.70;
  g.globalCompositeOperation='lighter';
  const near=g.createRadialGradient(tx,ty,8,tx,ty,H*.86);
  near.addColorStop(0,'rgba(255,241,220,1)');near.addColorStop(.46,'rgba(206,176,140,.58)');near.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=near;g.fillRect(0,0,W,H);
  const far=g.createRadialGradient(tx,ty,H*.42,tx,ty,H*1.6);
  far.addColorStop(0,'rgba(150,126,100,.42)');far.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=far;g.fillRect(0,0,W,H);
  TORCH=c;
}
// The first fit() waits until here, where the torch exists to be baked against the size it finds.
fit();bakeTorch();
function paintWall(){
  const off=((scrollY%TILEH)+TILEH)%TILEH;
  for(let x=0;x<W;x+=TILEW){
    ctx.drawImage(WALL,x,-off);
    if(TILEH-off<H)ctx.drawImage(WALL,x,TILEH-off);
  }
}
// The flame is applied twice and unequally, which is the one place this sheet departs from rock.html
// on purpose. There the wall and the pigment in it take the same light, because a still panel has
// only to look right. Here a mark is also a thing a hand must find in a seventh of a second, so the
// wall takes the whole fall of the flame and the marks laid on it take under half of it: the reach
// still ends, the corners still die, but a body at the edge of the light stays a body rather than a
// rumour. How far that can be pushed before the era stops being lit by one torch is a judgement.
function torchPass(strength){
  ctx.save();ctx.globalCompositeOperation='multiply';
  if(strength!==undefined)ctx.globalAlpha=strength;
  ctx.drawImage(TORCH,0,0,W,H);ctx.restore();
}
/* ================= THE THREE PRIMITIVES (simplified from rock.html) ================= */
/* A dab: a pad of wet ochre pressed and lifted. No stroke direction, no leading edge — the single
   mark this era's whole hand is built from. */
function dab(g,x,y,r,col,a,seed,rgbaOverride){
  if(a<=.003||r<=0)return;
  const rnd=mulberry32(((seed>>>0)||7)*2654435761>>>0);
  const gr=g.createRadialGradient(x,y,0,x,y,r);
  // rgbaOverride lets a caller hand in an already-mixed colour (the trajectory's charcoal-to-ochre
  // warmth ramp, say) instead of one of this sheet's fixed pigment hexes.
  if(rgbaOverride){gr.addColorStop(0,rgbaOverride);gr.addColorStop(.55,rgbaOverride.replace(/[\d.]+\)$/,(a*.72)+')'));gr.addColorStop(1,rgbaOverride.replace(/[\d.]+\)$/,'0)'));}
  else{gr.addColorStop(0,hexa(col,a));gr.addColorStop(.55,hexa(col,a*.72));gr.addColorStop(1,hexa(col,0));}
  g.save();g.fillStyle=gr;g.beginPath();
  for(let i=0;i<=9;i++){const t=i/9*TAU,rr=r*(.78+rnd()*.4);const px=x+Math.cos(t)*rr,py=y+Math.sin(t)*rr;i?g.lineTo(px,py):g.moveTo(px,py);}
  g.closePath();g.fill();g.restore();
}
/* A wash: the palm loaded and pressed again and again (Chauvet's Panel of Hand Dots) — never a
   flat fill, always a scatter of many small dabs so the mark keeps a hand's own unevenness. */
function wash(g,x,y,r,col,a,n,seed){const rnd=mulberry32(((seed>>>0)||3)*2246822519>>>0);
  for(let i=0;i<n;i++){const t=rnd()*TAU,dd=Math.sqrt(rnd());dab(g,x+Math.cos(t)*dd*r,y+Math.sin(t)*dd*r,r*(.18+rnd()*.22),col,a*(.5+.5*(1-dd)),i*7+seed);}}
/* A flint scratch: fresh pale stone in the groove, a dark shadow thrown to one side — never a clean
   ruled line, because nothing this era cut was ruled. */
function scratch(g,x0,y0,x1,y1,w,a,dash){
  g.save();g.lineCap='round';g.setLineDash(dash?[w*2.4,w*3]:[]);
  g.strokeStyle=hexa(T.charcoal,a*.55);g.lineWidth=w*1.5;
  g.beginPath();g.moveTo(x0+1,y0+1.3);g.lineTo(x1+1,y1+1.3);g.stroke();
  g.strokeStyle=hexa(T.kaolin,a*.62);g.lineWidth=w*.72;
  g.beginPath();g.moveTo(x0,y0);g.lineTo(x1,y1);g.stroke();
  g.restore();
}
/* A pecked hollow: stone struck with stone, a rim thrown up bright around a dark pit. Cup marks and
   the Shaft's rim are both this primitive; only the scale changes. */
function peck(g,x,y,r,a){
  g.save();
  g.beginPath();g.arc(x,y,r,0,TAU);g.fillStyle=hexa(T.manganese,a*.85);g.fill();
  g.beginPath();g.arc(x-r*.32,y-r*.32,r*.62,0,TAU);g.fillStyle=hexa(T.kaolin,a*.4);g.fill();
  g.restore();
}

/* ================= WORLD STATE ================= */
/* Forward is decreasing y (the traveller climbs the sheet); the darkness sits behind at a larger y
   and its own boundary falls over time to chase whoever stalls — src/simulation.js's floorY, in
   spirit, with none of its exact constants. Bodies and hazards live in this same world space and are
   drawn at worldY-scrollY, so nothing here is a fixed screen layout: the whole wall moves. */
// LEAD and XR are set by fit() against the viewport it finds, and re-set when the sheet is resized
// or the phone is turned; they are declared with W and H above.
/* The capture region is wide relative to the gap between bodies, and that ratio is the whole reason
   an ordinary release is landable. The shipped chart cuts every transfer to about the same short
   flight and gives a body a capture radius of roughly a third of it; this page first spaced bodies
   three to five hundred units apart behind a capture radius of forty, a tenth of the gap, and the
   result was a window one frame wide — a frame-exact oracle connected on eleven frames out of
   twelve hundred. That was never a readability finding, it was a geometry mistake, and JOURNEY's own
   one-frame measurement is about the *perfect* window, not about landing at all. */
const KINDS=[
  {kind:'faint', r:26,pad:26,weight:9,value:1},
  {kind:'bright',r:38,pad:26,weight:5,value:3},
  {kind:'moon',  r:50,pad:26,weight:2,value:5}
];
const KWEIGHT=KINDS.reduce((s,k)=>s+k.weight,0);
let RNG=mulberry32((Date.now()^0x9E3779B9)>>>0); // fresh each load: a memorised layout would test recall, not reading
function pickKind(){let r=RNG()*KWEIGHT;for(const k of KINDS){if(r<k.weight)return k;r-=k.weight;}return KINDS[0];}

let bodies,hazards,cracks,player,scrollY,darkY,frontierY,lastX,alive,deadTimer,deathReason,showLegend,showDiag;

function freshWorld(){
  bodies=[];hazards=[];cracks=[];lastX=0;frontierY=0;
  // seed a short run of background wall-scratches, world-space so they scroll like everything else
  for(let i=0;i<26;i++){const y=-RNG()*1800,x=(RNG()*2-1)*XR*1.3,a=RNG()*TAU,len=30+RNG()*70;
    cracks.push({x0:x,y0:y,x1:x+Math.cos(a)*len,y1:y+Math.sin(a)*len,w:.8+RNG()*1.1,a:.07+RNG()*.09});}
  ensureQueue(0);                     // lay the first stretch of wall before there is a traveller to measure it from
  const first=bodies[0];
  player={
    x:first.x,y:first.y,vx:0,vy:-BASE_SPEED,
    node:first,angle:-Math.PI/2,dir:1,speed:BASE_SPEED,rad:first.cap*.82,orbitSweep:0,
    trail:[]
  };
  first.visited=true;first.rad=player.rad;first.entryAngle=player.angle;first.entryDir=player.dir;
  scrollY=player.y-LEAD;darkY=player.y+560;
  alive=true;deadTimer=0;deathReason='';
}
/* Keep the queue filled a fair distance ahead of the traveller, and prune what has fallen well
   behind — the rock the darkness has already taken back needs no further paint. */
function ensureQueue(aheadFrom){
  const from=aheadFrom!==undefined?aheadFrom:player.y;
  while(frontierY>from-2200){
    frontierY-=170+RNG()*80;
    const k=pickKind();
    let x=lastX+(RNG()*2-1)*180;x=clamp(x,-XR,XR);lastX=x;
    const b={x,y:frontierY,r:k.r,cap:k.r+k.pad,kind:k.kind,value:k.value,visited:false,documented:0,seed:(RNG()*1e8)|0};
    bodies.push(b);
    if(bodies.length>1&&RNG()<.55){
      const prev=bodies[bodies.length-2],side=RNG()<.5?1:-1;
      const mx=(prev.x+b.x)/2+side*(70+RNG()*70),my=(prev.y+b.y)/2+(RNG()*2-1)*60;
      hazards.push({kind:RNG()<.5?'vortex':'flare',x:mx,y:my,core:20+RNG()*8,reach:64+RNG()*18,seed:(RNG()*1e8)|0,phase:RNG()*TAU});
    }
  }
}
function pruneWorld(){
  const back=darkY+520;
  bodies=bodies.filter(b=>b.y<back||b===player.node);
  hazards=hazards.filter(h=>h.y<back);
  cracks=cracks.filter(c=>c.y0<back);
  if(cracks.length<40&&RNG()<.06){const y=frontierY-RNG()*300,x=(RNG()*2-1)*XR*1.3,a=RNG()*TAU,len=30+RNG()*70;
    cracks.push({x0:x,y0:y,x1:x+Math.cos(a)*len,y1:y+Math.sin(a)*len,w:1+RNG()*1.4,a:.16+RNG()*.16});}
}
function target(){for(const b of bodies)if(!b.visited)return b;return null;}

function kill(reason){alive=false;deathReason=reason;deadTimer=1.15;}

/* Where a moving point first touches a circle over one step, as a fraction of the step, or null. The
   shipped game's own segmentCircle in miniature: a flight fast enough to step past a capture region
   between two frames has to be caught by the path it flew, not by where it happened to land. */
function swept(x0,y0,x1,y1,cx,cy,r){
  const dx=x1-x0,dy=y1-y0,fx=x0-cx,fy=y0-cy,a=dx*dx+dy*dy;
  if(a<1e-9)return fx*fx+fy*fy<=r*r?0:null;
  const t=clamp(-(fx*dx+fy*dy)/a,0,1),px=fx+dx*t,py=fy+dy*t;
  return px*px+py*py<=r*r?t:null;
}
/* ================= THE RELEASE GEOMETRY ================= */
/* Whether a release right now would actually connect is exactly a point-to-ray distance test: the
   flight after release never curves (see the header note on what this page does not port), so the
   set of angles that thread a given target's capture region is fixed for as long as both bodies hold
   still, and it repeats every revolution — a traveller gets to learn it, the same way a real orbit's
   period lets a player anticipate rather than merely react.

   Measured on this page (a headless run logging `hit` every animation frame across one held orbit,
   never releasing): the exact hit window is itself only about one frame wide, at plausible speeds —
   the same order of magnitude JOURNEY.md §3 measures for the shipped game. No material language
   changes that fact, because it isn't a drawing problem, it's the geometry of a fast orbit threading
   a small circle from a distance. What a drawing CAN do is stop the cue from being a hard on/off at
   that one-frame instant and instead let it ramp up over the tens of degrees before it, so a
   traveller reads "closer... closer... now" rather than "nothing, then everything" — `warmth` below
   is that ramp, LEAD world units wide, and it is the actual thing this prototype is testing. */
const LEAD_MARGIN=300;
function releaseFit(p,t){
  if(!p.node||!t)return null;
  const vx=tangentVX(p.angle,p.speed,p.dir),vy=tangentVY(p.angle,p.speed,p.dir);
  const sp=Math.hypot(vx,vy)||1,dx=vx/sp,dy=vy/sp;
  const tx=t.x-p.x,ty=t.y-p.y,proj=tx*dx+ty*dy;
  if(proj<=0)return null;
  const perp=Math.abs(tx*dy-ty*dx);
  const warmth=clamp(1-(perp-t.cap)/LEAD_MARGIN,0,1);
  return{proj,perp,warmth,hit:perp<=t.cap&&proj<2200};
}

/* Where letting go would connect, marked on the ring before it is needed. The shipped game draws
   precisely this — the run of the orbit a transfer threads the next one from, with the tangent struck
   brighter inside it — and it is what a player actually aims at: nobody reacts to an instant, they
   arrive at a mark they can already see. The first pass of this page had only the warming dust-line,
   which asks a hand to react; measured against the widened geometry the run is eight or nine frames,
   about a seventh of a second, which is a hand's worth of time rather than a reflex's. Its form here
   is a row of pressed dabs along the ring with one struck deeper at the middle of each run, and a
   line that would carry the traveller through a vortex or a flare is not marked at all, so danger is
   read in the same mark that carries the trajectory. */
const REL_STEPS=144;
function releaseMarks(p){
  if(!p.node)return null;
  const n=p.node,ok=new Array(REL_STEPS).fill(false);
  for(const t of bodies){
    if(t.visited||t===n||t.y>n.y-40)continue;
    for(let i=0;i<REL_STEPS;i++){
      if(ok[i])continue;
      const a=i/REL_STEPS*TAU,rx=n.x+Math.cos(a)*p.rad,ry=n.y+Math.sin(a)*p.rad;
      const vx=tangentVX(a,1,p.dir),vy=tangentVY(a,1,p.dir);
      const tx=t.x-rx,ty=t.y-ry,proj=tx*vx+ty*vy;
      if(proj<=0||proj>1600||Math.abs(tx*vy-ty*vx)>t.cap)continue;
      let clear=true;
      for(const h of hazards){const hx=h.x-rx,hy=h.y-ry,pr=hx*vx+hy*vy;
        if(pr>0&&pr<proj&&Math.abs(hx*vy-hy*vx)<h.reach){clear=false;break;}}
      if(clear)ok[i]=true;
    }
  }
  // The runs are collected from the first angle that does not connect, so none of them wraps and the
  // middle of each is simply its own midpoint — the one dab struck deeper, the one to arrive at.
  const base=ok.indexOf(false);
  if(base<0)return{ok,mids:[0]};
  const mids=[];let run=null;
  for(let k=0;k<REL_STEPS;k++){
    if(ok[(base+k)%REL_STEPS]){if(run)run.b=k;else run={a:k,b:k};}
    else if(run){mids.push((base+(run.a+run.b)/2)/REL_STEPS*TAU);run=null;}
  }
  if(run)mids.push((base+(run.a+run.b)/2)/REL_STEPS*TAU);
  return{ok,mids};
}
function drawReleaseMarks(p){
  const marks=releaseMarks(p);if(!marks)return;
  const n=p.node,cx=sx(n.x),cy=sy(n.y);
  for(let i=0;i<REL_STEPS;i++){
    if(!marks.ok[i])continue;
    const a=i/REL_STEPS*TAU;
    dab(ctx,cx+Math.cos(a)*p.rad,cy+Math.sin(a)*p.rad,2.1,T.ochre,.5,i*17+3);
  }
  for(const a of marks.mids){
    const mx=cx+Math.cos(a)*p.rad,my=cy+Math.sin(a)*p.rad;
    dab(ctx,mx,my,6.2,T.kaolin,.82,911);
    dab(ctx,mx,my,3.1,T.manganese,.7,912);
  }
}
/* ================= UPDATE ================= */
let last=performance.now();
function update(now){
  let dt=(now-last)/1000;last=now;dt=Math.min(dt,1/30);
  if(!alive){deadTimer-=dt;if(deadTimer<=0)freshWorld();return;}
  ensureQueue();
  const p=player;
  if(p.node){
    const n=p.node,turn=p.speed/p.rad*dt;
    p.angle+=p.dir*turn;p.orbitSweep+=turn;
    p.x=n.x+Math.cos(p.angle)*p.rad;p.y=n.y+Math.sin(p.angle)*p.rad;
    p.vx=tangentVX(p.angle,p.speed,p.dir);p.vy=tangentVY(p.angle,p.speed,p.dir);
    n.documented=clamp(p.orbitSweep/SWEEP_FULL,0,1);      // live while held — src/reveal.js's own rule
    // The crossing into a full observation is stamped once, and the ring reads its own age off it.
    if(n.documented>=1&&!n.sealAt)n.sealAt=performance.now();
    if(n.y>darkY)kill('dark');                            // judged on the body, not the orbit's own wobble
  }else{
    const ox=p.x,oy=p.y;
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.x<-XR-40){p.x=-XR-40;p.vx=Math.abs(p.vx);}       // an arcade wall, not a claim about real flight —
    if(p.x> XR+40){p.x= XR+40;p.vx=-Math.abs(p.vx);}      // it exists only so a bad tap can't strand the demo
    for(const h of hazards)if(swept(ox,oy,p.x,p.y,h.x,h.y,h.core)!==null){kill(h.kind);break;}
    // Every body on the wall can take the traveller, not merely the one being aimed at, and each is
    // tested against the whole step rather than against where the step happened to end. Both are what
    // the shipped game does, and together they are most of what makes an ordinary release forgiving:
    // a tap a little early or a little late still finds something to go round.
    if(alive){
      let caught=null,when=2;
      for(const t of bodies){
        if(t.visited||t===p.node)continue;
        const at=swept(ox,oy,p.x,p.y,t.x,t.y,t.cap);
        if(at!==null&&at<when){when=at;caught=t;}
      }
      if(caught){
        const t=caught;
        p.x=ox+(p.x-ox)*when;p.y=oy+(p.y-oy)*when;
        const rx=p.x-t.x,ry=p.y-t.y,dist=Math.hypot(rx,ry)||t.r,cross=rx*p.vy-ry*p.vx;
        p.dir=cross>=0?1:-1;p.angle=Math.atan2(ry,rx);p.rad=dist;p.speed=BASE_SPEED;
        p.node=t;p.orbitSweep=0;t.visited=true;t.entryAngle=p.angle;t.entryDir=p.dir;
      }
    }
    if(alive&&p.y>darkY)kill('dark');
  }
  p.trail.push({x:p.x,y:p.y});if(p.trail.length>16)p.trail.shift();
  if(alive){
    scrollY+=(p.y-LEAD-scrollY)*(1-Math.exp(-dt*3));
    darkY-=(24+Math.min(90,Math.max(0,-p.y)*.012))*dt;    // a slow, steady rise — this page tests reading, not survival
    pruneWorld();
  }
}

/* ================= RENDER ================= */
const sx=wx=>W/2+wx, sy=wy=>wy-scrollY;
function jaggedEdge(seed,width,step){const rnd=mulberry32((seed>>>0)||3),pts=[];
  for(let x=-40;x<=width+40;x+=step)pts.push(rnd()*22-6);return pts;}
const DARK_EDGE=jaggedEdge(9001,W+80,26);

/* The two roles are kept apart, and keeping them apart is the point.

   The RING is where an observation can be made. It is gameplay geometry: it says a capture will take
   here, and how wide the region is, and it does not change while the observation is being made,
   because a thing said twice is a thing said badly. The BODY is what has been learned, and it alone
   grows with the sweep. The one exception is the completion cue — a ring is allowed a single brief
   change of state on the crossing into a full observation, and then it is geometry again.

   The build is the era's own order of work rather than the atlas's. A crude mass of pigment goes on
   first, because that is what a hand does: colour before contour. The edge is walked round it next,
   off true. The wall's tooth comes up through the pigment as it is worked. Dabs accumulate — the same
   dabs in the same places, more of them, since `wash` is seeded and adding to `n` only ever adds. And
   the thing that says *which* body this is arrives last, exactly as the atlas's survey arcs do: the
   Moon gets its face only at the end of the orbit, not at the start of it. */
const REV={edge:[.10,.46],tooth:[.26,.70],marks:[.34,.88],detail:[.70,1]};
const revSpan=(t,r)=>clamp((t-r[0])/(r[1]-r[0]),0,1);
/* One closed path round a body, walked by a hand that was not being careful: the radius breathes on
   a slow harmonic with noise over it, and the path runs through the midpoints so it reads as a
   wavering line rather than a polygon. Seeded off the body, so it is the same edge every frame. */
function handEdge(g,x,y,r,seed){
  const rnd=mulberry32((seed>>>0)||5),ph=rnd()*TAU,steps=26,pts=[];
  for(let i=0;i<steps;i++){const a=i/steps*TAU,k=1+Math.sin(a*2+ph)*.10+Math.sin(a*5-ph)*.06+(rnd()-.5)*.15;
    pts.push([x+Math.cos(a)*r*k,y+Math.sin(a)*r*k*.95]);}
  const l=pts[steps-1],f=pts[0];g.beginPath();g.moveTo((l[0]+f[0])/2,(l[1]+f[1])/2);
  for(let i=0;i<steps;i++){const a=pts[i],b=pts[(i+1)%steps];g.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2);}
  g.closePath();
}
/* The ring: structurally stable, and the same ring whether an observation is a third or two thirds
   made. Its only variable is how much it is worth reading — a body already closed has nothing left
   to offer and recedes; the one the traveller is aiming at stands a little clearer than the rest. */
function drawRing(b,x,y,state){
  const N=28,seal=b.sealAt?clamp(1-(performance.now()-b.sealAt)/640,0,1):0,glow=seal*seal;
  for(let i=0;i<N;i++){
    const a=i/N*TAU;
    dab(ctx,x+Math.cos(a)*b.cap,y+Math.sin(a)*b.cap,(4.2+glow*2.6)*Math.max(.55,state),T.redOchre,(.5+glow*.4)*state,b.seed+i);
  }
  // The one breath in which the ring is allowed to speak: the dots draw together into a single struck
  // line, and a little dust lifts off it, and then it settles back to being where a capture takes.
  if(glow>.012){
    ctx.save();ctx.strokeStyle=hexa(T.kaolin,.42*glow);ctx.lineWidth=1.3+2.4*glow;
    ctx.beginPath();ctx.arc(x,y,b.cap,0,TAU);ctx.stroke();ctx.restore();
    for(let i=0;i<10;i++){const a=(i/10)*TAU+b.seed,lift=b.cap+6+(1-seal)*16;
      dab(ctx,x+Math.cos(a)*lift,y+Math.sin(a)*lift,2.6*glow,T.kaolin,.4*glow,b.seed+i+500);}
  }
}
/* The body: nothing of it is owed to the player before an orbit has been held round it. */
function drawObserved(b,x,y,d){
  const edge=revSpan(d,REV.edge),tooth=revSpan(d,REV.tooth);
  const marks=revSpan(d,REV.marks),detail=revSpan(d,REV.detail);
  const moon=b.kind==='moon',bright=b.kind==='bright';
  const tone=moon?T.kaolin:bright?T.redOchre:T.ochre,core=b.r*(moon?.94:bright?.72:.6);
  wash(ctx,x,y,core*1.06,tone,moon?.17:.58,moon?18:12,b.seed+91);
  if(marks>0)wash(ctx,x,y,core,tone,(moon?.15:.5)*Math.min(1,.35+marks),Math.round((moon?58:bright?40:22)*marks),b.seed);
  if(tooth>0){
    // The wall coming up through the pigment: what a hand loses to the rock it is working on.
    ctx.save();handEdge(ctx,x,y,core,b.seed^0x51ed);ctx.clip();
    const rnd=mulberry32((b.seed^0x2ba9)>>>0||7);
    for(let i=0;i<(moon?26:40);i++){const a=rnd()*TAU,rr=Math.sqrt(rnd())*core;
      dab(ctx,x+Math.cos(a)*rr,y+Math.sin(a)*rr,.7+rnd()*1.4,rnd()<.4?T.charcoal:T.manganese,(.05+rnd()*.12)*tooth,b.seed+i+30);}
    ctx.restore();
  }
  if(edge>0){
    ctx.save();handEdge(ctx,x,y,core*1.03,b.seed^0x51ed);
    ctx.strokeStyle=hexa(moon?T.manganese:T.charcoal,.3*edge);ctx.lineWidth=.9+.9*edge;ctx.stroke();ctx.restore();
  }
  // What the body is, rather than that it is: the last thing the orbit pays for, and the first thing
  // a player would have been handed for free if any of this were drawn before the sweep earned it.
  if(detail>0){
    if(moon)for(let i=0;i<7;i++){const rnd=mulberry32(b.seed+i*13);
      dab(ctx,x+(rnd()*2-1)*core*.5,y+(rnd()*2-1)*core*.5,(5+rnd()*5)*(.45+.55*detail),T.manganese,.8*detail,b.seed+i);}
    else if(bright)for(let i=0;i<7;i++){const a=i/7*TAU+b.seed,rr=core*1.24;
      dab(ctx,x+Math.cos(a)*rr,y+Math.sin(a)*rr,3.2+1.6*detail,T.manganese,.7*detail,b.seed+i+7);}
    else dab(ctx,x,y,3.2,T.manganese,.55*detail,b.seed+3);
  }
}
function drawBody(b,live){
  const x=sx(b.x),y=sy(b.y);
  if(y<-90||y>H+90)return;
  if(!live&&!b.visited){
    // Before an orbit has taken it a body is a phenomenon and nothing else: a light that keeps coming
    // back, per 01-rock.md, carrying a position and — through the width of its ring — a magnitude.
    const pulse=.28+.14*Math.sin(performance.now()/600+b.seed);
    dab(ctx,x,y,b.r*.52,T.ochre,pulse*1.05,b.seed);
    drawRing(b,x,y,b===target()?1:.6);
    return;
  }
  drawRing(b,x,y,live?1:.24);
  drawObserved(b,x,y,live?clamp(player.orbitSweep/SWEEP_FULL,0,1):(b.documented||0));
}

function drawHazard(h){
  const x=sx(h.x),y=sy(h.y);if(y<-100||y>H+100)return;
  const t=performance.now()/1000;
  if(h.kind==='vortex'){
    const gr=ctx.createRadialGradient(x,y,2,x,y,h.reach);
    gr.addColorStop(0,'rgba(0,0,0,.95)');gr.addColorStop(.45,'rgba(4,3,3,.7)');gr.addColorStop(1,'rgba(4,3,3,0)');
    ctx.save();ctx.fillStyle=gr;ctx.beginPath();ctx.arc(x,y,h.reach,0,TAU);ctx.fill();ctx.restore();
    ctx.beginPath();ctx.arc(x,y,h.core,0,TAU);ctx.fillStyle='#000';ctx.fill();
    for(let i=0;i<10;i++){const a=h.phase+i/10*TAU;peck(ctx,x+Math.cos(a)*h.core*1.15,y+Math.sin(a)*h.core*1.15,3.4,.85);}
  }else{
    // Deliberately its own colour, not the traveller's: the ember that is *you* has a hot white
    // core (src/simulation.js has nothing like this — it's an invented tell, but a needed one, since
    // an early pass of this page let the Flare and the traveller share one warm glow and read as the
    // same thing at a glance). The Flare never goes past deep red-orange, and a sooty ring sits
    // outside the glow rather than inside it, where it only muddied the core.
    ctx.save();ctx.globalCompositeOperation='lighter';
    const gr=ctx.createRadialGradient(x,y,0,x,y,h.core*1.15);
    gr.addColorStop(0,hexa(T.flare,.9));gr.addColorStop(.55,hexa(T.redOchre,.45));gr.addColorStop(1,hexa(T.redOchre,0));
    ctx.fillStyle=gr;ctx.beginPath();ctx.arc(x,y,h.core*1.15+Math.sin(t*7+h.phase)*2,0,TAU);ctx.fill();
    ctx.restore();
    for(let i=0;i<16;i++){const a=(i/16)*TAU,dd=h.core*1.35+Math.sin(t*4+i)*3;
      dab(ctx,x+Math.cos(a)*dd,y+Math.sin(a)*dd,7+((i*7)%5),T.manganese,.5,h.seed+i);}
  }
}

function drawTrajectory(p){
  if(!p.node)return;
  const t=target();
  const dx=tangentVX(p.angle,p.speed,p.dir),dy=tangentVY(p.angle,p.speed,p.dir),sp=Math.hypot(dx,dy)||1;
  const ux=dx/sp,uy=dy/sp,fit=releaseFit(p,t);
  // The trajectory is dust, not yet a mark: a path not struck is only drifting charcoal (rock.html's
  // own note on a flown-past route). It warms toward ochre as it currently nears threading the next
  // capture region, over LEAD_MARGIN world units of lead-in — not a snap at the exact instant, because
  // a cue with no ramp gives a traveller nothing to anticipate, and the exact instant a release
  // actually connects is itself only about a frame wide (see releaseFit's own note on that). What this
  // page is testing is whether that approach, drawn as warmth, is something a hand can read in time.
  const w=fit?fit.warmth:0,hit=!!(fit&&fit.hit);
  const len=fit?Math.min(fit.proj,420):220;
  const steps=22;
  for(let i=1;i<=steps;i++){
    const q=i/steps,fx=sx(p.x)+ux*len*q,fy=sy(p.y)+uy*len*q,fade=1-q*.72;
    const r=1.9+w*1.7,a=(.16+w*.5)*fade;
    dab(ctx,fx,fy,r,0,a,i*11+7,hexLerp(T.charcoal,T.redOchre,w,a));
  }
  if(hit){ // the spark a threaded line catches at the peak — an invented flourish, not a claim about
    const px=sx(p.x)+ux*Math.min(fit.proj,60),py=sy(p.y)+uy*Math.min(fit.proj,60); // the shipped Slingshot
    dab(ctx,px,py,6+2*Math.sin(performance.now()/40),0,.55,3,hexa(T.ember,1));
  }
}

function drawPlayer(p){
  for(let i=0;i<p.trail.length;i++){const q=i/p.trail.length,pt=p.trail[i];
    dab(ctx,sx(pt.x),sy(pt.y),2.4*q+.6,T.ember,.35*q,i+1);}
  const x=sx(p.x),y=sy(p.y);
  ctx.save();ctx.globalCompositeOperation='lighter';
  const gr=ctx.createRadialGradient(x,y,0,x,y,120);
  gr.addColorStop(0,hexa(T.ember,.16));gr.addColorStop(1,hexa(T.ember,0));
  ctx.fillStyle=gr;ctx.beginPath();ctx.arc(x,y,120,0,TAU);ctx.fill();
  const gr2=ctx.createRadialGradient(x,y,0,x,y,8);
  gr2.addColorStop(0,'rgba(255,247,225,1)');gr2.addColorStop(.4,hexa(T.ember,.9));gr2.addColorStop(1,hexa(T.ember,0));
  ctx.fillStyle=gr2;ctx.beginPath();ctx.arc(x,y,8,0,TAU);ctx.fill();
  ctx.restore();
}

function drawDarkness(){
  const y0=sy(darkY);
  if(y0>H+40)return;
  ctx.save();ctx.beginPath();ctx.moveTo(-10,y0+DARK_EDGE[0]);
  for(let i=0;i<DARK_EDGE.length;i++)ctx.lineTo(-40+i*26,y0+DARK_EDGE[i]);
  ctx.lineTo(W+10,H+10);ctx.lineTo(-10,H+10);ctx.closePath();
  ctx.fillStyle='#020202';ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.6)';ctx.lineWidth=6;ctx.stroke();  // the spall-margin: a torn edge, not a wipe
  ctx.restore();
}

function render(){
  paintWall();
  torchPass();
  for(const c of cracks){const y0=sy(c.y0);if(y0<-40||y0>H+40)continue;scratch(ctx,sx(c.x0),y0,sx(c.x1),sy(c.y1),c.w,c.a,false);}
  for(const b of bodies)if(b!==player.node)drawBody(b,false);
  for(const h of hazards)drawHazard(h);
  if(player.node)drawBody(player.node,true);
  drawReleaseMarks(player);
  drawTrajectory(player);
  drawPlayer(player);
  torchPass(.42);
  drawDarkness();
  if(!alive){ctx.fillStyle='rgba(0,0,0,'+clamp(1-deadTimer/1.15,0,1)*.7+')';ctx.fillRect(0,0,W,H);}
  if(showDiag)drawDiagnostic();
  if(showLegend)drawLegend();
}

/* ================= D — the diagnostic (shapes only, no text: circle, arrow, bar) ================= */
function drawDiagnostic(){
  const p=player,t=target();
  ctx.save();ctx.lineWidth=1.6;
  if(t){
    const x=sx(t.x),y=sy(t.y);
    ctx.strokeStyle='rgba(255,214,0,.9)';ctx.beginPath();ctx.arc(x,y,t.cap+9,0,TAU);ctx.stroke();       // target
    ctx.strokeStyle='rgba(0,220,255,.85)';ctx.setLineDash([5,5]);ctx.beginPath();ctx.arc(x,y,t.cap,0,TAU);ctx.stroke();ctx.setLineDash([]); // capture region
    const bw=6,bh=t.value*6;ctx.fillStyle='rgba(255,214,0,.85)';ctx.fillRect(x+t.cap+16,y-bh,bw,bh);      // magnitude bar
    const bar=44;ctx.strokeStyle='rgba(255,255,255,.5)';ctx.strokeRect(x-bar/2,y+t.cap+12,bar,6);
    ctx.fillStyle='rgba(255,255,255,.85)';ctx.fillRect(x-bar/2,y+t.cap+12,bar*(t.documented||0),6);        // documentation bar
  }
  if(p.node){
    const x=sx(p.node.x),y=sy(p.node.y);
    ctx.strokeStyle='rgba(0,220,255,.85)';ctx.setLineDash([5,5]);ctx.beginPath();ctx.arc(x,y,p.node.cap,0,TAU);ctx.stroke();ctx.setLineDash([]);
    const bar=44,d=clamp(p.orbitSweep/SWEEP_FULL,0,1);
    ctx.strokeStyle='rgba(255,255,255,.5)';ctx.strokeRect(x-bar/2,y+p.node.cap+12,bar,6);
    ctx.fillStyle='rgba(255,255,255,.85)';ctx.fillRect(x-bar/2,y+p.node.cap+12,bar*d,6);
  }
  const px=sx(p.x),py=sy(p.y);
  ctx.strokeStyle='rgba(120,255,120,.95)';                                                                // traveller crosshair
  ctx.beginPath();ctx.moveTo(px-9,py);ctx.lineTo(px+9,py);ctx.moveTo(px,py-9);ctx.lineTo(px,py+9);ctx.stroke();
  if(p.node){                                                                                              // trajectory arrow
    const dx=tangentVX(p.angle,p.speed,p.dir),dy=tangentVY(p.angle,p.speed,p.dir),sp=Math.hypot(dx,dy)||1;
    const ux=dx/sp,uy=dy/sp,len=140,ex=px+ux*len,ey=py+uy*len;
    ctx.strokeStyle='rgba(120,255,120,.95)';ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(ex,ey);ctx.stroke();
    const ang=Math.atan2(uy,ux);ctx.beginPath();ctx.moveTo(ex,ey);
    ctx.lineTo(ex-10*Math.cos(ang-.4),ey-10*Math.sin(ang-.4));ctx.moveTo(ex,ey);
    ctx.lineTo(ex-10*Math.cos(ang+.4),ey-10*Math.sin(ang+.4));ctx.stroke();
  }
  for(const h of hazards){const x=sx(h.x),y=sy(h.y);if(y<-100||y>H+100)continue;
    ctx.fillStyle='rgba(255,40,40,.28)';ctx.beginPath();ctx.arc(x,y,h.core,0,TAU);ctx.fill();
    ctx.strokeStyle='rgba(255,40,40,.85)';ctx.setLineDash([4,4]);ctx.beginPath();ctx.arc(x,y,h.reach,0,TAU);ctx.stroke();ctx.setLineDash([]);}
  ctx.restore();
}

/* ================= L — the legend: modern words over a sheet that has none ================= */
function label(x,y,s,align){
  align=align||'left';
  ctx.font='11px Georgia,"Times New Roman",serif';ctx.textAlign=align;
  const w=ctx.measureText(s).width,px=align==='center'?x-w/2:x;
  ctx.fillStyle='rgba(0,0,0,.68)';ctx.fillRect(px-4,y-12,w+8,16);
  ctx.fillStyle=T.legend;ctx.fillText(s,x,y);
}
function drawLegend(){
  ctx.save();ctx.fillStyle='rgba(3,6,10,.58)';ctx.fillRect(0,0,W,H);
  const p=player,t=target();
  label(16,20,'controls — click or space: release. L: this legend. D: modern diagnostic overlay.');
  const px=sx(p.x),py=sy(p.y);
  label(clamp(px+14,8,W-8),py-8,'traveller — the ochre crayon’s lit tip; you are the point actually touching the wall');
  if(p.node){
    const x=sx(p.node.x),y=sy(p.node.y);
    label(clamp(x+p.node.cap+10,8,W-8),y-14,'capture region — the dot-ring; cross it and the orbit takes hold');
    label(clamp(x+p.node.cap+10,8,W-8),y+6,'documentation — dabs pressed each pass; a sealed, closed ring means fully observed');
    label(clamp(px+18,8,W-8),py+16,'trajectory — where release, now, would send you; it warms when it threads the next capture region');
  }
  if(t&&t!==p.node){
    const x=sx(t.x),y=sy(t.y);
    if(y>-60&&y<H+60){
      label(clamp(x+t.r+8,8,W-8),y-2,'target — the phenomenon worth flying at now');
      label(clamp(x+t.r+8,8,W-8),y+16,'magnitude — a bigger dab and a struck spark-cluster is a brighter, more valuable body');
    }
  }
  // A ring the traveller has already left behind is still on the wall and still worth naming, even
  // with nobody orbiting it right now — the sheet remembers what it was told, per 01-rock.md's own
  // point about a mark outliving the hand that struck it.
  if(!p.node){
    const passed=bodies.find(b=>b.visited&&b!==t);
    if(passed){const x=sx(passed.x),y=sy(passed.y);
      if(y>-60&&y<H+60)label(clamp(x+passed.cap+10,8,W-8),y,'documentation, left behind — this ring’s fill is how much of that body was actually observed');}
  }
  for(const h of hazards){const x=sx(h.x),y=sy(h.y);if(y<-60||y>H+60)continue;
    label(clamp(x,8,W-8),y-h.reach-8,h.kind==='vortex'?'danger — the Shaft: the eye is drawn down into it':'danger — the Flare: a guttering torch’s scorch',(x<60||x>W-60)?'left':'center');
    break;}
  label(16,H-14,'the dark rising below — the forgetting: this era’s frontier, unrelated to the four dangers above');
  ctx.restore();
}

/* ---------- input: one tap is the whole vocabulary ---------- */
function doRelease(){
  const p=player,n=p.node;if(!n)return;
  n.documented=clamp(p.orbitSweep/SWEEP_FULL,0,1);   // frozen here, exactly as src/simulation.js:559 does at release
  p.node=null;
}
window.addEventListener('keydown',e=>{
  if(e.key===' '){e.preventDefault();if(alive)doRelease();}
  else if(e.key==='l'||e.key==='L')showLegend=!showLegend;
  else if(e.key==='d'||e.key==='D')showDiag=!showDiag;
});
cv.addEventListener('pointerdown',()=>{if(alive)doRelease();});

/* ---------- main loop ---------- */
showLegend=false;showDiag=false;
freshWorld();
function frame(now){update(now);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script>
</body>
