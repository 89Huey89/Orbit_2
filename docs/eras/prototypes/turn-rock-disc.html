<!doctype html>
<!--
  Orbit — the turn from I, "The Rock", to II, "The Disc", under the knowledge horizon
  (docs/eras/KNOWLEDGE-HORIZON.md), painted in the two hands already settled in rock.html and
  disc.html (docs/eras/01-rock.md, docs/eras/02-disc.md). This is a mockup of a mid-run page turn,
  not of the run's opening: the traveller has already climbed three bodies and has just been
  captured by a fourth when the century changes.

  THE CONCEIT. The vertical of the sheet is space and the stack of sheets is time. The bottom edge
  of every sheet is the Earth — the place the observer stands, the place the darkness rises from,
  and the place the next sheet is pushed up from. When the page turns the OBSERVER goes back to the
  ground and looks up again; the TRAVELLER does not. The flight, the rows, the score and the chart
  run on unbroken underneath, exactly as the shipped page turn already keeps them, and only the
  hand that draws them is a later one. What the new hand inherits is the record: the flown route
  is struck again from the ground up, tap by tap, because the Bronze Age read the older marks the
  same way we read theirs — from the floor, in a poorer light, and then went further.

  WHAT EACH ERA CAN KNOW. Neither sheet shows the game's seven families, because neither culture
  could see a surface. The Rock tells its bodies apart by the only thing a naked eye can measure,
  brightness, so a body is a dab of ochre in one of three sizes; the Disc tells them apart by
  nothing at all, one punch always, which is the disc's own grammar (research §2). The Moon is the
  one body with a face on either sheet: a pale disc with dark blotches on the rock, the gold crescent
  on the disc. The constellation is a cluster of dots on the rock, six with three ringed (as
  ambiguous as Lascaux's shoulder dots are), and the Pleiades on the disc, seven punches. The orbit
  rings, the release and capture geometry and the route are the same on both sheets, because they
  are the apparatus and not the claim.

  THE TURN, by a phase t from 0 to 1 (auto-plays over nine seconds and loops; Space pauses;
  the arrow keys scrub by 0.02; ?t=0.42 in the URL holds a phase for a screenshot):
    0.00–0.15  the Rock; the ember lands on the held body — a capture, on which the page is armed.
    0.15–0.60  the Disc rises from the bottom edge, from the Earth, with its shadow and its cut rim
               ahead of it, over the rock, which stays where it lies and goes dark beneath.
    0.47–0.85  the inherited route is re-struck from the floor upward, each tap with the punch's own
               flash; each earlier body's ring is chased as the taps reach it; the held body is
               struck last, in place, and its ring chased — the first thing the new century sees.
    0.85–1.00  a faint museum gloss, in the modern serif and nobody else's words.

  Every mark on the rock is a dab, a stencil or a flint scratch lit by one carried torch; every
  mark on the disc is chased, damascened, punched or pecked under one raking light. Both sheets are
  baked once; per frame only the turn, the ember, the barge, the re-striking and the gloss are drawn.
  Press L for a legend naming each thing by the game's own term.
-->

<script>
'use strict';
/* ---------- seeded randomness, so both sheets are the same sheets on every load ---------- */

const W=1280,H=800;

/* ---------- canvas: a fixed 1280x800 sheet drawn at devicePixelRatio and scaled to the window ---------- */
const cv=document.getElementById('c'),ctx=cv.getContext('2d',{alpha:false});
let DPR=1;
function fit(){DPR=Math.max(1,Math.min(2,window.devicePixelRatio||1));const s=Math.min(window.innerWidth/W,window.innerHeight/H);

/* ================= ONE CHART, TWO HANDS ================= */
/* The chart is the same object on both sheets: the same bodies at the same places, the same orbit
   radii, the same route. Only the depiction changes. `mag` is the one thing the Rock can know about
   a body — 0 bright, 1 middle, 2 faint — and the one thing the Disc refuses to. */
const NODES={
  A:{x:520,y:655,r:42,mag:2},B:{x:700,y:540,r:50,mag:1},C:{x:540,y:415,r:46,mag:2},
  D:{x:720,y:270,r:58,mag:0},                                   // the held body
  E:{x:300,y:560,r:40,mag:1},F:{x:960,y:470,r:50,mag:0},G:{x:1010,y:645,r:38,mag:2}};
const MOON={x:350,y:320,r:60,body:30};
const CLUSTER={x:950,y:230};
const CL3=[[-40,12],[-8,-24],[30,18]];                          // the three the game's route uses
const CL_ROCK=[[-56,-14],[-2,4],[36,-14]];                      // three more on the wall, unringed
const CL_DISC=[[-52,-16],[2,-46],[42,-10],[8,36]];              // four more punches: the Pleiades' seven
const FY=690;                                                   // where the unlit rock begins to rise

/* The route: from the bottom edge — the floor, the Earth — up through A, B and C, each held for
   part of a lap, to the entry point on D. One polyline, sampled fine, with the index at which each
   ring is reached kept beside it, so both hands can strike it in the same order. */
function ringPt(n,a){return[n.x+Math.cos(a)*n.r,n.y+Math.sin(a)*n.r];}
function curve(p,q){const dx=q[0]-p[0],dy=q[1]-p[1],d=Math.hypot(dx,dy),mx=(p[0]+q[0])*.5,my=(p[1]+q[1])*.5;
  const cx=mx-dy/d*d*.22,cy=my+dx/d*d*.22,n=Math.max(4,Math.round(d/5)),o=[];
  for(let i=0;i<=n;i++){const t=i/n,u=1-t;o.push([u*u*p[0]+2*u*t*cx+t*t*q[0],u*u*p[1]+2*u*t*cy+t*t*q[1]]);}return o;}
function buildRoute(){
  const order=[NODES.A,NODES.B,NODES.C,NODES.D],pts=[],marks={};let prev=[600,H];
  for(let k=0;k<order.length;k++){const n=order[k],next=order[k+1];
    const ang=Math.atan2(prev[1]-n.y,prev[0]-n.x);
    let aIn=ang+.55,dir=1;
    if(next){ // hold the lap the way that leaves the ring nearest the next body
      const e1=ringPt(n,aIn+Math.PI*1.25),e2=ringPt(n,ang-.55-Math.PI*1.25);
      if(Math.hypot(e2[0]-next.x,e2[1]-next.y)<Math.hypot(e1[0]-next.x,e1[1]-next.y)){aIn=ang-.55;dir=-1;}}

    for(const q of(pts.length?seg.slice(1):seg))pts.push(q);
    marks[k]={node:n,idx:pts.length-1,aIn:aIn,dir:dir};
    if(!next)break;
    const aOut=aIn+dir*Math.PI*1.25,m=Math.round(Math.abs(aOut-aIn)*n.r/5);
    for(let i=1;i<=m;i++){const a=aIn+(aOut-aIn)*i/m;pts.push(ringPt(n,a));}
    prev=ringPt(n,aOut);}

const ROUTE=buildRoute();
const HELD=ROUTE.marks[3];                                      // the entry on D
const LAST_FROM=ROUTE.marks[2];                                 // C: the route is dry up to its exit
let lastStart=ROUTE.pts.length-1;while(lastStart>0&&Math.hypot(ROUTE.pts[lastStart][0]-NODES.C.x,ROUTE.pts[lastStart][1]-NODES.C.y)>NODES.C.r+2)lastStart--;
const DRY=ROUTE.pts.slice(0,lastStart+1),LAST=ROUTE.pts.slice(lastStart);   // dry up to C; the last transfer is flown live

/* ================= I · THE ROCK ================= */
const TR={redOchre:'#9C3B22',ochre:'#C9962E',ochreDeep:'#A9701F',manganese:'#211F1E',charcoal:'#2C2622',kaolin:'#EAE1CF',stone:'#C7BC9E',flame:'#FFBE72'};
/* The torch is carried: it stands where the traveller is, so the wall is lit round the held body
   and the floor the run climbed from has gone back into the dark. */
const TX=690,TY=330,AMB=.085;
const NW=642,NH=402;
function octave(arr,cx,cy,amp,seed){
  const gw=Math.ceil(NW/cx)+3,gh=Math.ceil(NH/cy)+3,rnd=mulberry32(seed),lat=new Float32Array(gw*gh);
  for(let i=0;i<lat.length;i++)lat[i]=rnd();
  for(let y=0;y<NH;y++){const fy=y/cy,iy=fy|0,sy=ss(fy-iy);
    for(let x=0;x<NW;x++){const fx=x/cx,ix=fx|0,sx=ss(fx-ix),i0=iy*gw+ix;
      const t=lat[i0]+(lat[i0+1]-lat[i0])*sx,b=lat[i0+gw]+(lat[i0+gw+1]-lat[i0+gw])*sx;
      arr[y*NW+x]+=amp*(t+(b-t)*sy);}}}
function build(specs){const a=new Float32Array(NW*NH);
  for(const o of specs)octave(a,o[0],o[1],o[2],o[3]);
  let lo=1e9,hi=-1e9;for(let i=0;i<a.length;i++){if(a[i]<lo)lo=a[i];if(a[i]>hi)hi=a[i];}
  const k=1/(hi-lo||1);for(let i=0;i<a.length;i++)a[i]=(a[i]-lo)*k;return a;}
const HF=build([[152,112,1,101],[76,58,.44,202],[37,31,.185,303],[18,16,.072,404],[9,8,.030,505],[4.5,4,.013,606]]);
const CF=build([[70,240,1,707],[26,120,.45,808],[10,44,.2,909]]);
const SF=build([[210,170,1,1010],[88,72,.4,1111]]);
const GX=new Float32Array(NW*NH),GY=new Float32Array(NW*NH);
for(let y=1;y<NH-1;y++)for(let x=1;x<NW-1;x++){const i=y*NW+x;GX[i]=(HF[i+1]-HF[i-1])*.5;GY[i]=(HF[i+NW]-HF[i-NW])*.5;}
function samp(F,x,y){const fx=x*.5,fy=y*.5;let ix=fx|0,iy=fy|0;
  if(ix<0)ix=0;else if(ix>NW-2)ix=NW-2;if(iy<0)iy=0;else if(iy>NH-2)iy=NH-2;
  const tx=fx-ix,ty=fy-iy,i0=iy*NW+ix,t=F[i0]+(F[i0+1]-F[i0])*tx,b=F[i0+NW]+(F[i0+NW+1]-F[i0+NW])*tx;
  return t+(b-t)*ty;}
const hAt=(x,y)=>samp(HF,x,y),calAt=(x,y)=>samp(CF,x,y);
function edgeAt(x,y){const n=(calAt(x,y)-.5)*54+(hAt(x,y)-.5)*30;
  return ss(clamp((Math.min(x,W-x,y*1.15,(H-y)*1.1)+n)/112,0,1));}
/* The rising darkness is the rock the torch has not reached: nothing is drawn, the light simply
   stops. Its edge is the wall's own, bitten by the calcite runs and the swells. */
function floodRaw(y,cal,h){return ss(clamp((y-(FY+(cal-.5)*44+(h-.5)*26))/95,0,1));}
function floodAt(x,y){return floodRaw(y,calAt(x,y),hAt(x,y));}
const fall=d=>AMB+.44/(1+2.6*(d/430)*(d/430))+.50/(1+.80*(d/1180)*(d/1180));

function litRGB(hex,x,y,k){const n=parseInt(hex.slice(1),16),L=lightAt(x,y)*(k||1)*1.5+.07;
  return 'rgb('+Math.min(255,(n>>16&255)*L|0)+','+Math.min(255,(n>>8&255)*(L*.83)|0)+','+Math.min(255,(n&255)*(L*.62)|0)+')';}
function paintRockGround(){
  const A=document.createElement('canvas'),LT=document.createElement('canvas'),SP=document.createElement('canvas');
  for(const c of[A,LT,SP]){c.width=W;c.height=H;}
  const ag_=A.getContext('2d'),lg=LT.getContext('2d'),sg=SP.getContext('2d');
  const ai=ag_.createImageData(W,H),li=lg.createImageData(W,H),si=sg.createImageData(W,H),AD=ai.data,LD=li.data,SD=si.data;
  const hash=(x,y)=>{let n=Math.imul(x,374761393)+Math.imul(y,668265263);n=Math.imul(n^n>>>13,1274126177);return((n^n>>>16)>>>0)/4294967296;};

    const fx=x*.5,fy=y*.5;let ix=fx|0,iy=fy|0;
    if(ix>NW-2)ix=NW-2;if(iy>NH-2)iy=NH-2;
    const tx=fx-ix,ty=fy-iy,i0=iy*NW+ix,i1=i0+1,i2=i0+NW,i3=i2+1,
      w0=(1-tx)*(1-ty),w1=tx*(1-ty),w2=(1-tx)*ty,w3=tx*ty;
    const h=HF[i0]*w0+HF[i1]*w1+HF[i2]*w2+HF[i3]*w3,
          cal=CF[i0]*w0+CF[i1]*w1+CF[i2]*w2+CF[i3]*w3,
          stn=SF[i0]*w0+SF[i1]*w1+SF[i2]*w2+SF[i3]*w3;
    let gx=(GX[i0]*w0+GX[i1]*w1+GX[i2]*w2+GX[i3]*w3)*112,
        gy=(GY[i0]*w0+GY[i1]*w1+GY[i2]*w2+GY[i3]*w3)*112;
    const r1=hash(x,y),r2=hash(x+7919,y+104729),r3=hash(x>>1,(y>>1)+31337);
    gx+=(r1-.5)*.30+(r3-.5)*.34;gy+=(r2-.5)*.30+(hash((x>>1)+77,y>>1)-.5)*.34;
    const cw=cal*cal,gr=(r1-.5)*11;
    AD[p]=196+46*cw+26*h-30*stn+gr;AD[p+1]=185+44*cw+24*h-38*stn+gr;AD[p+2]=156+46*cw+21*h-44*stn+gr;AD[p+3]=255;
    let dx=TX-x,dy=TY-y;const d=Math.sqrt(dx*dx+dy*dy)+1e-3;dx/=d;dy/=d;
    const fl=1-.9*floodRaw(y,cal,h);

    let lam=.60-(gx*dx+gy*dy)*.40;if(lam<0)lam=0;else if(lam>1.6)lam=1.6;

    let sp=lam-.92;sp=sp>0?sp*sp*cw*cw*L*168:0;if(sp>110)sp=110;

  ag_.putImageData(ai,0,0);lg.putImageData(li,0,0);sg.putImageData(si,0,0);
  return{albedo:A,light:LT,sheen:SP};}

/* ---- the three primitives of the rock: dab, stencil, scratch (and the pecked pit) ---- */
let FLAT=false;
function dab(g,x,y,r,col,a,seed){
  const rel=FLAT?.5:hAt(x,y),al=clamp(a*(.56+.78*(1-rel)),0,1);if(al<.004)return;
  const rnd=mulberry32(((seed>>>0)||7)*40503>>>0),gr=g.createRadialGradient(x,y,0,x,y,r);
  gr.addColorStop(0,hexa(col,al));gr.addColorStop(.5,hexa(col,al*.74));gr.addColorStop(.82,hexa(col,al*.28));gr.addColorStop(1,hexa(col,0));
  g.save();g.fillStyle=gr;g.beginPath();
  for(let i=0;i<=10;i++){const t=i/10*TAU,rr=r*(.8+rnd()*.4),px=x+Math.cos(t)*rr,py=y+Math.sin(t)*rr;i?g.lineTo(px,py):g.moveTo(px,py);}
  g.closePath();g.fill();g.restore();}
function wash(g,x,y,r,col,a,seed,squash){const rnd=mulberry32(((seed>>>0)||3)*2654435761>>>0),sq=squash||1;
  if(r<10){dab(g,x,y,r,col,a*.94,seed);
    for(let i=0;i<4;i++){const t=rnd()*TAU,d=rnd()*r*.45;dab(g,x+Math.cos(t)*d,y+Math.sin(t)*d*sq,r*(.36+rnd()*.4),col,a*.5,seed+i*7);}return;}
  const n=Math.round(r*r*.14)+16;
  for(let i=0;i<n;i++){const t=rnd()*TAU,dd=Math.sqrt(rnd()),px=x+Math.cos(t)*dd*r,py=y+Math.sin(t)*dd*r*sq;
    dab(g,px,py,r*(.16+rnd()*.2),col,a*(.5+.5*(1-dd)),i*7+seed);}}
const PADS=new Map();
function pad(r,col,v){const k=r+col+v;let c=PADS.get(k);if(c)return c;
  const q=Math.ceil(r*1.5)+3;c=document.createElement('canvas');c.width=c.height=q*2;
  const g=c.getContext('2d');g.translate(q,q);FLAT=true;wash(g,0,0,r,col,1,v*37+5,1);FLAT=false;PADS.set(k,c);return c;}
function stamp(g,x,y,r,col,a,seed){const c=pad(Math.round(r),col,(seed>>>0)&7);
  g.save();g.globalAlpha=clamp(a*(.56+.78*(1-hAt(x,y))),0,1);g.drawImage(c,x-c.width*.5,y-c.height*.5);g.restore();}
function cover(g,x,y,r,col,a,seed){const rnd=mulberry32(((seed>>>0)||5)*97+11),L=lightAt(x,y);if(L<.05)return;
  const gr=g.createRadialGradient(x,y,0,x,y,r),cc=litRGB(col,x,y),al=clamp(a*(.4+.9*(1-hAt(x,y)))*clamp(L*1.5,0,1),0,1);
  gr.addColorStop(0,cc.replace('rgb(','rgba(').replace(')',','+al+')'));
  gr.addColorStop(1,cc.replace('rgb(','rgba(').replace(')',',0)'));
  g.save();g.fillStyle=gr;g.beginPath();
  for(let i=0;i<=9;i++){const t=i/9*TAU,rr=r*(.78+rnd()*.44);i?g.lineTo(x+Math.cos(t)*rr,y+Math.sin(t)*rr):g.moveTo(x+Math.cos(t)*rr,y+Math.sin(t)*rr);}
  g.closePath();g.fill();g.restore();}
function scratch(g,p,o){o=o||{};const w=o.w||1.6,al=o.alpha!=null?o.alpha:1,brk=o.brk!=null?o.brk:.13,rnd=mulberry32((((o.seed>>>0)||3)*2246822519)>>>0);
  g.save();g.lineCap='round';g.lineJoin='round';
  for(let i=1;i<p.length;i++){
    const x0=p[i-1][0],y0=p[i-1][1],x1=p[i][0],y1=p[i][1],mx=(x0+x1)*.5,my=(y0+y1)*.5,L=lightAt(mx,my);
    if(L<.05)continue;if(rnd()<brk*(.4+hAt(mx,my)))continue;
    let dx=TX-mx,dy=TY-my;const d=Math.hypot(dx,dy)||1;dx/=d;dy/=d;const off=w*.62,dk=o.dark?1:0;
    g.strokeStyle='rgba(20,16,12,'+(al*(.5*L+.12)*(1+dk*.9)).toFixed(3)+')';g.lineWidth=w*(1.2+dk*.5);
    g.beginPath();g.moveTo(x0-dx*off,y0-dy*off);g.lineTo(x1-dx*off,y1-dy*off);g.stroke();
    g.strokeStyle='rgba(233,222,197,'+(al*.4*L*(1-dk*.82)).toFixed(3)+')';g.lineWidth=w*.78;
    g.beginPath();g.moveTo(x0,y0);g.lineTo(x1,y1);g.stroke();
    g.strokeStyle='rgba(255,224,172,'+(al*(dk?.3:.52)*L).toFixed(3)+')';g.lineWidth=Math.max(.5,w*(dk?.26:.4));
    g.beginPath();g.moveTo(x0+dx*off*.95,y0+dy*off*.95);g.lineTo(x1+dx*off*.95,y1+dy*off*.95);g.stroke();}
  g.restore();}
function peck(g,x,y,r,o){o=o||{};const L=lightAt(x,y);if(L<.05)return;const a=(o.alpha!=null?o.alpha:1)*L;
  let dx=TX-x,dy=TY-y;const d=Math.hypot(dx,dy)||1;dx/=d;dy/=d;g.save();
  let gr=g.createRadialGradient(x+dx*r*.55,y+dy*r*.55,0,x,y,r*1.9);
  gr.addColorStop(0,'rgba(255,225,174,'+(a*.5).toFixed(3)+')');gr.addColorStop(1,'rgba(255,225,174,0)');
  g.fillStyle=gr;g.beginPath();g.arc(x,y,r*1.95,0,TAU);g.fill();
  g.beginPath();g.arc(x,y,r,0,TAU);g.fillStyle='rgba(28,23,18,'+(a*.6+.07).toFixed(3)+')';g.fill();
  g.beginPath();g.arc(x-dx*r*.36,y-dy*r*.36,r*.58,0,TAU);g.fillStyle='rgba(232,204,158,'+(a*.46).toFixed(3)+')';g.fill();
  g.restore();}
function handShape(g,cx,cy,s,dir,flip,d){
  g.save();g.translate(cx,cy);g.rotate(dir);g.scale(flip,1);g.lineCap='round';g.lineJoin='round';
  g.beginPath();g.ellipse(0,.06*s,.38*s+d,.44*s+d,0,0,TAU);g.fill();
  g.beginPath();g.ellipse(.02*s,.44*s,.27*s+d,.26*s+d,0,0,TAU);g.fill();
  for(const[a,len,th]of[[-1.13,1.00,.082],[-1.40,1.14,.086],[-1.68,1.06,.082],[-1.96,.88,.074]]){
    g.lineWidth=th*2*s+d*2;g.beginPath();g.moveTo(Math.cos(a)*.24*s,Math.sin(a)*.24*s-.02*s);

function crackPath(x,y,steps,seed){const rnd=mulberry32(((seed>>>0)||11)*22695477>>>0),p=[[x,y]];let a=rnd()*TAU;

/* ---- the Rock's bodies: a dab in one of three sizes, and a dot-ring for its orbit ---- */
const DAB_R=[21,13.5,7.5];                                      // bright, middle, faint
function rockBody(g,n,seed){const r=DAB_R[n.mag];
  wash(g,n.x,n.y,r,n.mag===2?TR.ochreDeep:TR.redOchre,n.mag===2?.8:1.1,seed,1);
  if(n.mag<2)wash(g,n.x,n.y,r*.6,TR.redOchre,n.mag===0?.9:.5,seed+3,1);}   // pressed twice: the bright ones were

  for(let i=0;i<m;i++){const a=i/m*TAU,x=n.x+Math.cos(a)*n.r,y=n.y+Math.sin(a)*n.r*.97;
    wash(g,x,y,5.4,TR.redOchre,1.05,i*5+seed,1);}}
/* The Moon: the one body with a face. Kaolin, the covering pigment, lit from the torch, with the

  wash(g,MOON.x,MOON.y,MOON.body,TR.kaolin,0,1,1);
  for(let i=0;i<260;i++){const t=rnd()*TAU,dd=Math.pow(rnd(),.45);cover(g,MOON.x+Math.cos(t)*dd*MOON.body*.98,MOON.y+Math.sin(t)*dd*MOON.body*.98,4+rnd()*8,TR.kaolin,.22+rnd()*.26,i+7);}
  for(let i=0;i<60;i++){const t=rnd()*TAU;cover(g,MOON.x+Math.cos(t)*MOON.body*.9,MOON.y+Math.sin(t)*MOON.body*.9,2.5+rnd()*3.5,TR.kaolin,.5,i*3+9);}}
function rockMoonFace(g){

    wash(g,MOON.x+dx,MOON.y+dy,r,TR.manganese,a,(dx*7+dy)|0,1);}

function paintRockPigment(g){
  // the wall carried marks before this run: older dots under everything, and a cluster of hand dots
  for(let i=0;i<110;i++){const x=60+RR()*1160,y=60+RR()*640;
    let clear=Math.hypot(x-128,y-112)>170&&Math.hypot(x-CLUSTER.x,y-CLUSTER.y)>110&&Math.hypot(x-MOON.x,y-MOON.y)>MOON.r+22;
    for(const k in NODES){const b=NODES[k];if(Math.hypot(x-b.x,y-b.y)<b.r+26)clear=false;}
    if(clear)wash(g,x,y,3+RR()*2.6,RR()<.7?TR.redOchre:TR.ochreDeep,.14+RR()*.22,i*7,1);}
  for(let i=0;i<30;i++)wash(g,1090+RR()*100,120+RR()*70,7.5,TR.redOchre,.5,i*11+1,1);
  stencil(g,128,112,64,-.06,1,5,TR.redOchre);                  // the title and the maker's mark, one gesture
  for(const k in NODES){const n=NODES[k];rockRing(g,n,k.charCodeAt(0)*31);rockBody(g,n,k.charCodeAt(0)*17);}
  rockRing(g,MOON,77);rockMoon(g);rockMoonFace(g);
  // the cluster: six dots, three of them warmed and larger — as ambiguous as the wall itself is
  for(let i=0;i<3;i++)wash(g,CLUSTER.x+CL3[i][0],CLUSTER.y+CL3[i][1],10,TR.redOchre,1,i*17+5,1);
  for(let i=0;i<3;i++)wash(g,CLUSTER.x+CL_ROCK[i][0],CLUSTER.y+CL_ROCK[i][1],8,TR.ochreDeep,.62,i*19+9,1);
  // HUD: the score as a dot field, and the best as a fainter one, and the ochre in hand as a smear
  const df=(x,y,w,h,n,seed)=>{const rnd=mulberry32(seed);for(let i=0;i<n;i++)wash(g,x+rnd()*w,y+rnd()*h,5+rnd()*2.4,TR.redOchre,1.1,i*3+seed,1);};
  df(520,40,150,42,44,31);df(1040,40,110,48,22,41);
  for(let i=0;i<40;i++)wash(g,520+i*4.8,110+Math.sin(i*.4)*2.6,10,TR.ochreDeep,.16,i*3+9,.6);
  for(let i=0;i<27;i++)wash(g,520+i*4.8,110+Math.sin(i*.4)*2.6,10,TR.redOchre,.8,i*3+9,.6);}

function paintRockCuts(g){
  for(let i=0;i<11;i++){const p=crackPath(60+RR()*1160,50+RR()*640,20+RR()*34,i*13+7);

    scratch(g,[[n.x+Math.cos(a)*(n.r+10),n.y+Math.sin(a)*(n.r+10)],[n.x-Math.cos(a)*(n.r+10),n.y-Math.sin(a)*(n.r+10)]],{w:1.5,alpha:.7,brk:.12,seed:n.x});}

  for(let i=0;i<3;i++){const p=[];for(let k=0;k<=34;k++){const t=k/34*TAU;p.push([CLUSTER.x+CL3[i][0]+Math.cos(t)*16,CLUSTER.y+CL3[i][1]+Math.sin(t)*16]);}

  // the HUD's tallies: pace, then flow, one notch per unit; one scored rule brackets them

    scratch(g,[[px+(i%3)*.6,y],[px-1.2+(i%2)*.9,y+h]],{w:i<n?2.6:1.3,alpha:i<n?1:.32,brk:i<n?.03:.3,seed:seed+i});}};
  tally(520,136,5,7,17,12,201);tally(520,164,3,5,17,12,211);
  scratch(g,[[506,130],[506,186]],{w:2.2,alpha:.8,brk:.1,seed:221});
  scratch(g,[[1028,40],[1028,92]],{w:2,alpha:.7,brk:.14,seed:223});
  // the floor: the run's notch-rule along the bottom, the Lebombo bone laid flat, most of it gone
  // back into the dark the torch has left behind
  for(let i=0;i<58;i++){const x=124+i*18.4,h=(i%5===4)?22:14;
    scratch(g,[[x,772-h],[x-1.8,772]],{w:i%5===4?3:2.1,alpha:i<41?1:.34,brk:.06,seed:400+i});}}

/* The ember is the torch, carried: it flies the last transfer in, lands on D at t=0.08, and circles. */
const T_CAP=.08,SPIN=19.8;
function emberAt(t){
  if(t<T_CAP){const q=clamp(t/T_CAP,0,1),i=q*(LAST.length-1),k=Math.min(LAST.length-2,i|0),f=i-k;
    return[lerp(LAST[k][0],LAST[k+1][0],f),lerp(LAST[k][1],LAST[k+1][1],f)];}
  const a=HELD.aIn+HELD.dir*(t-T_CAP)*SPIN;return[NODES.D.x+Math.cos(a)*NODES.D.r,NODES.D.y+Math.sin(a)*NODES.D.r*.97];}
function paintRockLive(g,t,br){
  // the last transfer, laid wet behind the ember and drying into the route
  const q=clamp(t/T_CAP,0,1),n=Math.max(2,Math.round(1+q*(LAST.length-1)));
  scratch(g,LAST.slice(0,n),{w:2.2,alpha:.9,brk:.1,seed:78});
  if(t>=T_CAP){ // the capture: a broken etched ripple, and the lap itself scratched as it is held
    const age=t-T_CAP,rr=NODES.D.r+8+ss(clamp(age/.09,0,1))*26,al=clamp(1-age/.1,0,1);
    if(al>0){const p=[];for(let i=0;i<=60;i++){const a=i/60*TAU;p.push([NODES.D.x+Math.cos(a)*rr,NODES.D.y+Math.sin(a)*rr*.97]);}
      scratch(g,p,{w:1.6,alpha:al*.9,brk:.4,seed:501});}
    const a0=HELD.aIn,a1=HELD.aIn+HELD.dir*Math.min(TAU,age*SPIN),m=Math.max(2,Math.round(Math.abs(a1-a0)*NODES.D.r/5)),p=[];
    for(let i=0;i<=m;i++){const a=a0+(a1-a0)*i/m;p.push([NODES.D.x+Math.cos(a)*NODES.D.r,NODES.D.y+Math.sin(a)*NODES.D.r*.97]);}
    scratch(g,p,{w:2.2,alpha:.9,brk:.1,seed:79});}
  // the aim guide toward the cluster, as far as the torch's breath allows
  const e=emberAt(t);
  if(t>=T_CAP){g.save();g.globalCompositeOperation='multiply';const tx=CLUSTER.x+CL3[0][0],ty=CLUSTER.y+CL3[0][1];
    for(let i=1;i<=14;i++){const qq=i/14;if(qq>.62)break;stamp(g,lerp(e[0],tx,qq)+Math.sin(qq*2.2)*16,lerp(e[1],ty,qq)-Math.sin(qq*Math.PI)*40,4,TR.ochreDeep,.5*(1-qq*.5),i*7);}
    g.restore();}
  for(let i=11;i>0;i--){const b=emberAt(t-i*.0028),qq=1-i/12;blit(g,EMBER,b[0],b[1],13*qq+4,.45*qq*qq,'lighter');}
  blit(g,EMBER,e[0],e[1],46*br,.95,'lighter');}

function ink(g,x,y,s,o){o=o||{};g.save();g.font=face(o.size||10,o.style||'');g.fillStyle=o.fill||TD.gloss;g.textAlign=o.align||'center';g.textBaseline=o.base||'alphabetic';

function poly(g,p,close){g.beginPath();g.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)g.lineTo(p[i][0],p[i][1]);if(close)g.closePath();}

function bandPts(cx,cy,ri,ro,a0,a1,seed){return arcPts(cx,cy,ro,a0,a1,.7,seed).concat(arcPts(cx,cy,ri,a1,a0,.7,seed+1));}

  g.drawImage(DFLOOD.c,0,0,W,H);
  // the gloss: a museum label in the modern serif, which is the only writing this object honestly carries
  const ga=clamp((t-.85)/.1,0,1);
  if(ga>0){ink(g,168,598,'II · the disc · c. 1600 BCE',{size:12.5,style:'italic',align:'left',alpha:ga});
    ink(g,168,614,'the observer returns to Earth; the traveller does not',{size:9.5,fill:TD.glossDim,align:'left',track:1.1,alpha:ga});}}

/* ================= THE TURN ================= */
const T_S0=.15,T_S1=.60;
function sheetOffset(t){if(t<T_S0)return H;if(t>=T_S1)return 0;return H*(1-ss((t-T_S0)/(T_S1-T_S0)));}
function paintTurn(g,t,secs){
  const yoff=sheetOffset(t),u=clamp((t-T_S0)/(T_S1-T_S0),0,1);
  g.fillStyle='#050403';g.fillRect(0,0,W,H);
  if(yoff>0){ // the rock stays where it lies and goes dark beneath the sheet coming up over it
    g.save();g.globalAlpha=1-.55*ss(u);g.drawImage(ROCK.c,0,0,W,H);
    const br=flicker(g,secs);paintRockLive(g,t,br);g.restore();
    if(yoff<H){const sh=g.createLinearGradient(0,yoff-90,0,yoff);sh.addColorStop(0,'rgba(0,0,0,0)');sh.addColorStop(1,'rgba(0,0,0,.7)');
      g.fillStyle=sh;g.fillRect(0,yoff-90,W,90);}}
  if(yoff<H){g.save();g.translate(0,yoff);g.drawImage(DISC.c,0,0,W,H);paintDiscLive(g,t);g.restore();
    // the cut edge: the rim itself is the leading edge, and it catches the light as it comes up
    if(yoff>0){g.save();g.globalAlpha=.7;g.strokeStyle='rgba(244,214,150,.9)';g.lineWidth=1.2;g.beginPath();g.moveTo(0,yoff+.5);g.lineTo(W,yoff+.5);g.stroke();g.restore();}}}

/* ---------- the legend (press L): the game's own term against each thing on whichever sheet is up ---------- */
const LEG_ROCK=[
  [640,786,'the bottom edge is the Earth — the cave floor, where the run climbed from; the torch has moved on and the floor has gone dark'],
  [NODES.D.x,NODES.D.y-NODES.D.r-14,'the held body — the ember has just landed (a capture): the page is armed on it'],
  [NODES.B.x+70,NODES.B.y+8,'the route — a flint line from the floor up through three bodies, each ring struck through once it is left'],
  [NODES.F.x,NODES.F.y-NODES.F.r-12,'bright'],[NODES.E.x,NODES.E.y-NODES.E.r-12,'middle'],[NODES.G.x,NODES.G.y-NODES.G.r-12,'faint — three sizes of dab, the only difference a naked eye can measure'],
  [MOON.x,MOON.y-MOON.r-12,'the Moon — the one body with a face'],
  [CLUSTER.x,CLUSTER.y-70,'the cluster — six dots, three ringed: the constellation, as ambiguous as the wall is'],
  [640,FY+20,'the flood — unlit rock rising from below: nothing is drawn'],
  [595,30,'HUD — score as a dot field, pace and flow as tallies, the ochre in hand as a smear'],
  [128,224,'the hand stencil — the title and the maker\'s mark; no word exists']];
const LEG_DISC=[
  [640,786,'the bottom edge is the Earth — the barge and the rim; this sheet came up from here'],
  [NODES.D.x,NODES.D.y-NODES.D.r-14,'the held body — re-struck in gold, in place: the first thing this century sees'],
  [NODES.B.x+70,NODES.B.y+8,'the inherited route — the older record, re-read from the ground up as a run of taps'],
  [NODES.F.x,NODES.F.y-NODES.F.r-12,'one punch, always — no size codes brightness (the disc\'s own grammar)'],
  [MOON.x,MOON.y-MOON.r-12,'the Moon — the crescent'],
  [CLUSTER.x,CLUSTER.y-88,'the Pleiades — seven punches, the figure itself; three of them the route'],
  [640,660,'the flood — the ground the disc went into, rising'],
  [168,632,'the gloss — a modern museum label, never the culture\'s own words'],
  [264,50,'the title mark — sun or full moon, and the crescent'],
  [860,30,'HUD — score and best as punched bands, pace, flow, the foil narrowing as it is spent'],
  [70,400,'the horizon arcs — the attested 82°, the frame and the scale']];
function paintLegend(g,t){const disc=t>=.33,yo=disc?sheetOffset(t):0;
  g.save();g.fillStyle='rgba(3,6,10,.58)';g.fillRect(0,0,W,H);
  for(const[x,y0,s]of(disc?LEG_DISC:LEG_ROCK)){const y=y0+yo;if(y<12||y>H-4)continue;
    g.font=face(10.5);g.textAlign='center';try{g.letterSpacing='.5px';}catch(e){}
    const w=g.measureText(s).width,cx=clamp(x,w/2+10,W-w/2-10);
    g.fillStyle='rgba(0,0,0,.66)';g.fillRect(cx-w/2-5,y-11,w+10,15);
    g.fillStyle=TD.legend;g.fillText(s,cx,y);
    g.beginPath();g.moveTo(x,y+2);g.lineTo(x,y+9);g.strokeStyle='rgba(150,205,190,.5)';g.lineWidth=1;g.stroke();}
  g.restore();}

/* ---------- the clock: nine seconds a turn, looping; Space holds it, the arrows scrub it, ?t= pins it ---------- */
const CYCLE=9;
const pinned=(()=>{const m=/[?&]t=([0-9.]+)/.exec(location.search);return m?clamp(parseFloat(m[1]),0,.999):null;})();
let showLegend=false,paused=pinned!=null,phase=pinned!=null?pinned:0,last=performance.now();
window.addEventListener('keydown',e=>{
  if(e.key==='l'||e.key==='L')showLegend=!showLegend;
  else if(e.key===' '){paused=!paused;e.preventDefault();}
  else if(e.key==='ArrowRight'){phase=(phase+.02)%1;paused=true;}
  else if(e.key==='ArrowLeft'){phase=(phase-.02+1)%1;paused=true;}});
function frame(now){const dt=(now-last)/1000;last=now;
  if(!paused)phase=(phase+dt/CYCLE)%1;
  paintTurn(ctx,phase,now/1000);
  if(showLegend)paintLegend(ctx,phase);
  requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script>
</body>
