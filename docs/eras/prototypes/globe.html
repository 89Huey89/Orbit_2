<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit — IV · The Globe (prototype)</title>
<!--
  Fonts: Amiri (naskh, captions) and Reem Kufi (kufic, the colophon's monumental register) —
  both SIL Open Font License 1.1, by Khaled Hosny. See fonts/README.md for provenance; both
  are now the full local faces the prototype folder ships, loaded here by @font-face exactly
  as the game will later embed a cut subset (per CLAUDE.md's `npm run fonts`). Unicode block
  set: Arabic U+0600–06FF (base letters, digits, diacritics) plus the presentation forms
  Amiri's own shaping draws on (Arabic Presentation Forms-A/B, U+FB50–FEFF) for correct naskh
  joining. The browser's own bidi/shaping engine does the joining and right-to-left ordering;
  this file never hand-shapes a glyph run, only calls fillText with ctx.direction='rtl'.
  document.fonts.ready is awaited before the first paint, so the sheet's first frame is
  already set in the real hand. The hand-drawn qalam-squiggle fallback (fakeNaskh/fakeDigits)
  is kept only for a genuine load failure — it is no longer on the normal path.
-->
<style>
  @font-face{font-family:'Amiri';src:url('fonts/amiri.ttf') format('truetype');font-weight:400 700;font-style:normal;font-display:block}
  @font-face{font-family:'Reem Kufi';src:url('fonts/reem-kufi.ttf') format('truetype');font-weight:400;font-style:normal;font-display:block}
  html,body{margin:0;padding:0;background:#0c0906;height:100%;overflow:hidden}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  #hint{position:fixed;left:10px;bottom:8px;color:#8a7c5c;font:11px/1.4 Georgia,serif;opacity:.55;letter-spacing:.03em}
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1280" height="800"></canvas></div>
<div id="hint">L — legend</div>
<script>
'use strict';
/* Orbit · era prototype — IV · The Globe (Islamic Golden Age, al-Ṣūfī, 964 CE)
   Grammar chosen: the MANUSCRIPT PAGE (docs/eras/research/globe.md §2), per the brief's
   own steer — sized cream paper, fine brown-black contour, flat colour fills, gold discs
   for stars laid over the figure, lapis and vermilion the prized accents. The instrument
   grammar (engraved brass, no colour) appears only once, small, as a colophon vignette —
   a globe glimpsed rather than the page it replaces. Every name/colour/mark below is
   pulled from that research file; where it offered options (raʾs al-tinnīn vs al-Ghūl for
   the attractor) one is picked and the choice is noted at the call site.
   Seven pickup/vehicle names (sling, shield, reflector, inkwell, comet) are not in the
   research's name table — it flags only the seven families/dangers/currency as covered —
   so they are built here from attested general vocabulary (dirʿ "armour", miqlāʿ "sling",
   rādd "one who turns back", dawāh "inkwell", mudhannab "the tailed one", the standard
   modern word for comet) rather than invented outright, and are marked as such below. */

// ---------- palette, straight off research §3 ----------
const TOKENS={
  ground:'#efe1c4',          // sized cream manuscript paper — the ground is the page, never the sky
  ink:'#241c11',             // lamp-black soot ink (ḥibr/midād) — every contour, every letter
  gold:'#d4af37',            // burnished gold leaf — star discs, rims, illumination borders
  shellGold:'#c9a227',       // shell gold — fine linework where leaf can't be laid
  lapis:'#1b3f8f',           // lapis lazuli ultramarine (lājvard) — costlier than the gold beside it
  vermilion:'#e34234',       // ground cinnabar — robes, rubrication, heat
  orpiment:'#f4c430',        // arsenic-sulfide yellow — secondary figure colour, ornament
  verdigris:'#3e8e7e',       // malachite/verdigris — secondary figure colour, foliate ornament
  brass:'#8a6e3e',           // engraved brass — the instrument-grammar ground, vignette only
  paper2:'#e7d6ac',
  fox:'rgba(140,96,52,.10)'
};
const TAU=Math.PI*2;
function clamp(v,a,b){return v<a?a:v>b?b:v}
function lerp(a,b,t){return a+(b-a)*t}
// mulberry32 — the whole sheet paints identically every load from one integer seed.
function mulberry32(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rngGlobal=mulberry32(964); // the era's own year, doubling as the seed

// ---------- Eastern Arabic-Indic numerals (research §4) — HUD reads only in these ----------
const EASTDIG=['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
function toEastern(n){return String(n).replace(/[0-9]/g,d=>EASTDIG[+d])}

// ---------- the qalam: one reed-nib primitive family, exactly as burinArc/burinSegment
// are the game's single stroke primitive. A qalam nib is cut at a shallow diagonal, so a
// stroke swells and thins by drag angle alone — no pressure modulation, unlike a quill —
// and it never lifts within a joined run (research §4). reedSegment/reedArc give every
// line on this sheet that same dry, evenly-swelling character; punchDot is the gold disc
// / iʿjām-dot primitive (a burnished leaf point, or an ink dot set after the skeleton). */
function reedSegment(g,x0,y0,x1,y1,rgb,alpha,weight,seed,opts={}){
  const rng=mulberry32(seed>>>0||1),dx=x1-x0,dy=y1-y0,len=Math.hypot(dx,dy)||1;
  const nx=-dy/len,ny=dx/len,segs=opts.segments??clamp(Math.round(len/9),3,22);
  const wobAmp=(opts.wobble??.55)*(1+rng()*.4),wobPhase=rng()*TAU;
  const drift=Math.atan2(dy,dx),swell=Math.sin(drift*2+rng()*TAU)*.35; // the nib's own bias by drag angle
  g.strokeStyle=`rgba(${rgb},${alpha})`;g.lineCap='round';
  for(let i=0;i<segs;i++){
    const t0=i/segs,t1=(i+1)/segs,mid=(t0+t1)/2;
    const wob=Math.sin(mid*TAU*2+wobPhase)*wobAmp*(opts.taper?Math.sin(mid*Math.PI):1);
    const ax=lerp(x0,x1,t0)+nx*wob*.4,ay=lerp(y0,y1,t0)+ny*wob*.4;
    const bx=lerp(x0,x1,t1)+nx*wob,by=lerp(y0,y1,t1)+ny*wob;
    g.lineWidth=Math.max(.15,weight*(1+swell*.5+Math.sin(mid*Math.PI)*.25));
    g.beginPath();g.moveTo(ax,ay);g.lineTo(bx,by);g.stroke();
  }
}
function reedArc(g,cx,cy,r,from,to,rgb,alpha,weight,seed,opts={}){
  const rng=mulberry32(seed>>>0||1),span=to-from,segs=opts.segments??clamp(Math.round(Math.abs(span)*r/7),5,60);
  const wobAmp=(opts.wobble??.4)*(1+rng()*.5),wobPhase=rng()*TAU,ry=opts.ry??r;
  g.strokeStyle=`rgba(${rgb},${alpha})`;g.lineCap='round';
  if(opts.pool)punchDot(g,cx+Math.cos(from)*r,cy+Math.sin(from)*ry,weight*1.3,`rgba(${rgb},${alpha*.8})`,null,seed+999); // ink pools where the reed sets down
  for(let i=0;i<segs;i++){
    const a0=from+span*i/segs,a1=from+span*(i+1)/segs,mid=(a0+a1)/2;
    const wob=Math.sin(mid*4+wobPhase)*wobAmp;
    g.lineWidth=Math.max(.15,weight*(1+Math.sin(mid*3+wobPhase)*.3));
    g.beginPath();g.ellipse(cx,cy,Math.max(.2,r+wob),Math.max(.2,ry+wob),0,a0,a1);g.stroke();
  }
}
// reedPath — a qalam never lifts within a joined run (research §4), so the whole run gets
// exactly one ink-pool at its own start, not one per segment.
function reedPath(g,pts,closed,rgb,alpha,weight,seed,opts={}){
  if(opts.pool)punchDot(g,pts[0][0],pts[0][1],weight*1.3,`rgba(${rgb},${alpha*.8})`,null,seed+999);
  for(let i=0;i<pts.length-(closed?0:1);i++){
    const a=pts[i],b=pts[(i+1)%pts.length];
    reedSegment(g,a[0],a[1],b[0],b[1],rgb,alpha,weight,seed+i*13,{segments:Math.max(3,Math.round(Math.hypot(b[0]-a[0],b[1]-a[1])/10))});
  }
}
// punchDot — a leaf-gold star disc, or (small/ink) an iʿjām dot set after a run.
function punchDot(g,x,y,r,fill,rim,seed){
  const rng=mulberry32((seed>>>0||1)+7);
  g.fillStyle=fill;g.beginPath();g.arc(x,y,r,0,TAU);g.fill();
  if(rim)reedArc(g,x,y,r*.94,0,TAU,rim,.9,Math.max(.3,r*.14),seed,{segments:10,wobble:.12});
  g.fillStyle=`rgba(36,28,17,${.15+rng()*.1})`;g.beginPath();g.arc(x-r*.3,y-r*.3,r*.3,0,TAU);g.fill();
}

// ---------- lettering: Amiri for Arabic (shaped by the browser), a plain serif gloss
// beneath for transliteration. faceFor keeps every ctx.font in one place, the way the
// shipped game's plateFace() does, so a later port only edits this function. ----------
let amiriReady=false,reemReady=false;
function faceFor(size,script,weight){
  if(script==='ku')return `${weight||''} ${size}px ${reemReady?"'Reem Kufi', ":''}${amiriReady?'Amiri, ':''}sans-serif`.trim();
  if(script==='ar')return `${weight||''} ${size}px ${amiriReady?'Amiri, ':''}"Noto Naskh Arabic", "Arial", sans-serif`.trim();
  return `${weight||'italic'} ${size}px Georgia, "Times New Roman", serif`;
}
// kufiText — Reem Kufi, the era's third, monumental/carved hand (research §4), used only
// for the colophon's coin-like roundel: kufic is for "cartouches, coin-like roundels,
// architectural bands," never for running captions. Falls back to Amiri (still correct
// Arabic, just the wrong register) before ever falling back to the hand-drawn squiggle.
function kufiText(g,text,x,y,size,opts={}){
  if(reemReady||amiriReady||opts.forceType){
    g.save();g.direction='rtl';g.textAlign=opts.align||'center';g.textBaseline='alphabetic';
    g.font=faceFor(size,'ku',opts.weight);g.fillStyle=`rgba(${opts.rgb||'36,28,17'},${opts.alpha??1})`;
    g.fillText(text,x,y);g.restore();
  }else fakeNaskh(g,text,x,y,size,opts.rgb||'36,28,17',opts.alpha??1,opts.seed);
}
// fakeNaskh — the graceful fallback. If Amiri never loads, captions are not left to fall
// back onto Times New Roman; instead a qalam sketches an abstract joined-run silhouette
// (a baseline stroke, a few connected teeth, a dot pass) standing in for the word-shape,
// which is closer to what an unlettered viewer of this sheet would actually see happen.
function textSeed(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0)||1}
function fakeNaskh(g,text,xRight,y,size,rgb,alpha,seed){
  seed=seed||textSeed(text);const rng=mulberry32(seed);
  const n=clamp(Math.round(text.replace(/\s/g,'').length*.55),3,10),unit=size*.58,w=unit*n;
  const base=[];for(let i=0;i<=n;i++){const t=i/n;base.push([xRight-w*t,y+Math.sin(t*7+seed%5)*size*.045]);}
  reedPath(g,base,false,rgb,alpha,size*.075,seed); // the unbroken baseline run — the pen never lifts mid-word
  for(let i=0;i<n;i++){
    const t=(i+.5)/n,bx=xRight-w*t,by=y+Math.sin(t*7+seed%5)*size*.045,roll=rng();
    if(roll<.4){const h=size*(.5+rng()*.35); // an ascender's hooked rise — lām/alif-like
      reedArc(g,bx+size*.05,by-h*.5,h*.42,2.4,4.6,rgb,alpha*.95,size*.06,seed+i*9,{segments:6,wobble:.15});
    }else if(roll<.68){const h=size*(.32+rng()*.22); // a descender's curling tail — wāw/yā-like
      reedArc(g,bx-size*.04,by+h*.55,h*.5,.4,3.4,rgb,alpha*.9,size*.055,seed+i*9+3,{segments:6,wobble:.15});
    }
  }
  for(let i=0;i<Math.max(1,Math.round(n*.45));i++)punchDot(g,xRight-w*rng(),y+(rng()<.5?-size*.34:size*.3),size*.042,`rgba(${rgb},${alpha})`,null,seed+90+i); // iʿjām
}
// fakeDigits — Eastern numerals are set, not joined the way a naskh word is (a numeral
// run stays left-to-right even inside an RTL line), so each glyph is its own isolated mark.
function fakeDigits(g,text,xRight,y,size,rgb,alpha,seed){
  seed=seed||textSeed(text);const rng=mulberry32(seed);
  const glyphs=[...text],unit=size*.6,w=unit*glyphs.length,x0=xRight-w;
  glyphs.forEach((ch,i)=>{
    const cx=x0+unit*(i+.5),cy=y-size*.28,r=size*.22;
    if(ch==='.'||ch===','){punchDot(g,cx,y,size*.035,`rgba(${rgb},${alpha})`,null,seed+i);return}
    if(ch==='×'){reedSegment(g,cx-r*.5,cy-r*.3,cx+r*.5,cy+r*.3,rgb,alpha,size*.05,seed+i,{segments:3});
      reedSegment(g,cx-r*.5,cy+r*.3,cx+r*.5,cy-r*.3,rgb,alpha,size*.05,seed+i+1,{segments:3});return}
    const from=rng()*1.2;reedArc(g,cx,cy,r,from,from+3.4+rng()*1.6,rgb,alpha,size*.08,seed+i*7,{segments:8,wobble:.12,ry:r*.9});
  });
}
// arabicText — right-to-left, right-anchored (manuscript captions are right-set), with a
// graceful hand-drawn fallback. Every Arabic caption on the sheet goes through this.
function arabicText(g,text,x,y,size,opts={}){
  const rgb=opts.rgb||'36,28,17',alpha=opts.alpha??1,align=opts.align||'right',kind=opts.kind||'word';
  if(amiriReady||opts.forceType){
    g.save();g.direction='rtl';g.textAlign=align;g.textBaseline='alphabetic';
    g.font=faceFor(size,'ar',opts.weight);g.fillStyle=`rgba(${rgb},${alpha})`;
    g.fillText(text,x,y);g.restore();
  }else{
    let xRight=x;
    if(align==='center'){const n=kind==='digits'?text.length:clamp(Math.round(text.replace(/\s/g,'').length*.55),3,10);
      xRight=x+(kind==='digits'?size*.6:size*.58)*n/2;}
    if(kind==='digits')fakeDigits(g,text,xRight,y,size,rgb,alpha,opts.seed);
    else fakeNaskh(g,text,xRight,y,size,rgb,alpha,opts.seed);
  }
}
function translitText(g,text,xRight,y,size,opts={}){
  g.save();g.textAlign=opts.align||'right';g.textBaseline='alphabetic';
  g.font=faceFor(size,'lat',opts.weight);g.fillStyle=`rgba(${opts.rgb||'80,64,40'},${opts.alpha??.85})`;
  g.fillText(text,xRight,y);g.restore();
}

// ---------- the ground: sized cream paper, texture generated not flat ----------
// paintGround — several generated layers baked once, per ART-CRITIQUE.md #1 ("a radial
// gradient is not a material"): base tone, a directional pulp-fibre grain (handmade paper
// felts in one dominant lay direction, not isotropic noise), coarse mottle, sparse foxing,
// and an edge treatment (the sheet reads darker toward its own boundary, as a real leaf does
// under raking light) rather than one flat swatch.
function paintGround(g,w,h,seed){
  const rng=mulberry32(seed);
  g.fillStyle=TOKENS.ground;g.fillRect(0,0,w,h); // base tone
  const grain=-0.08; // the felt's dominant lay — nearly horizontal, not isotropic
  for(let i=0;i<2600;i++){
    const x=rng()*w,y=rng()*h,l=1.5+rng()*4,a=grain+(rng()-.5)*.9,al=.02+rng()*.05;
    g.strokeStyle=`rgba(90,68,38,${al})`;g.lineWidth=.6;
    g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke();
  }
  for(let i=0;i<26;i++){ // coarse mottle — larger, fainter blooms under the fine grain
    const x=rng()*w,y=rng()*h,rx=40+rng()*90,ry=rx*(.5+rng()*.5);
    const gr=g.createRadialGradient(x,y,0,x,y,Math.max(rx,ry));
    gr.addColorStop(0,'rgba(200,172,120,.05)');gr.addColorStop(1,'rgba(200,172,120,0)');
    g.save();g.translate(x,y);g.scale(rx/Math.max(rx,ry),ry/Math.max(rx,ry));g.fillStyle=gr;
    g.beginPath();g.arc(0,0,Math.max(rx,ry),0,TAU);g.fill();g.restore();
  }
  for(let i=0;i<40;i++){ // foxing/tide marks, sparse
    const x=rng()*w,y=rng()*h,r=14+rng()*40;
    const gr=g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,'rgba(150,104,52,.07)');gr.addColorStop(1,'rgba(150,104,52,0)');
    g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,TAU);g.fill();
  }
  // a broad, uneven wash so the page doesn't read as a flat swatch
  const wash=g.createLinearGradient(0,0,w,h);
  wash.addColorStop(0,'rgba(239,225,190,.5)');wash.addColorStop(.5,'rgba(230,212,168,.15)');wash.addColorStop(1,'rgba(214,193,142,.35)');
  g.fillStyle=wash;g.fillRect(0,0,w,h);
  // edge treatment — the leaf sits under raking light, darker toward its own boundary
  const vg=g.createRadialGradient(w*.5,h*.48,Math.min(w,h)*.32,w*.5,h*.5,Math.max(w,h)*.72);
  vg.addColorStop(0,'rgba(60,42,20,0)');vg.addColorStop(1,'rgba(50,34,16,.16)');
  g.fillStyle=vg;g.fillRect(0,0,w,h);
}

// ---------- frame: plain ruled border + fine gold rule inside (research §9 — this
// tradition has no cartouche, no scale bar, table-and-figure side by side) ----------
function paintFrame(g,w,h,seed){
  reedSegment(g,26,26,w-26,26,'36,28,17',.85,1.3,seed+1,{segments:60,wobble:.25});
  reedSegment(g,26,h-26,w-26,h-26,'36,28,17',.85,1.3,seed+2,{segments:60,wobble:.25});
  reedSegment(g,26,26,26,h-26,'36,28,17',.85,1.3,seed+3,{segments:44,wobble:.25});
  reedSegment(g,w-26,26,w-26,h-26,'36,28,17',.85,1.3,seed+4,{segments:44,wobble:.25});
  const m=36;
  reedSegment(g,m,m,w-m,m,'201,162,39',.8,.7,seed+5,{segments:50,wobble:.15});
  reedSegment(g,m,h-m,w-m,h-m,'201,162,39',.8,.7,seed+6,{segments:50,wobble:.15});
  reedSegment(g,m,m,m,h-m,'201,162,39',.8,.7,seed+7,{segments:36,wobble:.15});
  reedSegment(g,w-m,m,w-m,h-m,'201,162,39',.8,.7,seed+8,{segments:36,wobble:.15});
  // footer strip — matches the shipped game's footer-strip layout slot
  g.fillStyle='rgba(90,68,38,.08)';g.fillRect(36,h-58,w-72,20);
  reedSegment(g,36,h-58,w-36,h-58,'36,28,17',.4,.6,seed+9,{segments:40,wobble:.2});
  // small, tucked inside the double rule itself — a corner tick, not a bracket that would
  // fight the HUD text sitting just inside it (the first pass sized this too large and it
  // collided with "best"/"title"; ART-CRITIQUE.md's furniture-vs-content layering note)
  [[30,30,1,1],[w-30,30,-1,1],[30,h-30,1,-1],[w-30,h-30,-1,-1]].forEach(([cx,cy,sx,sy],i)=>cornerOrnament(g,cx,cy,sx,sy,seed+60+i));
}
// cornerOrnament — kufic's angular, no-curve register, per research §4 ("anything meant to
// look carved rather than written"): a stepped geometric bracket, not a European cartouche.
function cornerOrnament(g,cx,cy,sx,sy,seed){
  const s=8;
  const pts=[[0,0],[3*s*sx,0],[3*s*sx,s*sy],[2*s*sx,s*sy],[2*s*sx,2*s*sy],[s*sx,2*s*sy],[s*sx,3*s*sy],[0,3*s*sy]].map(([x,y])=>[cx+x,cy+y]);
  reedPath(g,pts,false,'201,162,39',.8,1.1,seed,{});
  reedArc(g,cx,cy,3,0,TAU,'36,28,17',.7,.8,seed+1,{segments:8});
}

// ---------- the brass globe vignette: instrument grammar reduced to a colophon roundel
// (research §2 — no colour, no fill, only incised line on metal; stars are physical
// points, not drawn discs) ----------
function paintVignetteGlobe(g,cx,cy,r,seed){
  g.save();g.beginPath();g.arc(cx,cy,r,0,TAU);g.clip();
  const gr=g.createRadialGradient(cx-r*.3,cy-r*.3,r*.1,cx,cy,r*1.1);
  gr.addColorStop(0,'#a4855a');gr.addColorStop(1,TOKENS.brass);
  g.fillStyle=gr;g.fillRect(cx-r,cy-r,r*2,r*2);
  reedArc(g,cx,cy,r*.62,0,TAU,'54,42,24',.5,1,seed+1,{segments:20,wobble:.2}); // meridian ring
  reedArc(g,cx,cy,r*.4,.3,TAU-.3,'54,42,24',.4,.7,seed+2,{ry:r*.18,segments:14,wobble:.15});
  for(let i=0;i<14;i++){const a=i/14*TAU;reedSegment(g,cx+Math.cos(a)*r*.2,cy+Math.sin(a)*r*.2,cx+Math.cos(a)*r*.58,cy+Math.sin(a)*r*.58,'54,42,24',.3,.5,seed+10+i);}
  g.restore();
  reedArc(g,cx,cy,r,0,TAU,'54,42,24',.7,1.1,seed+3,{segments:24,wobble:.15});
}

// ---------- bodies: gilt roundels (research §8 manuscript mode) ----------
const FAMILIES=['ocean','crater','ringed','ice','dune','volcanic','storm'];
function paintBody(g,cx,cy,r,family,seed){
  const rng=mulberry32(seed);
  const fill={ocean:TOKENS.lapis,crater:'#c9b989',ringed:'#cdb384',ice:'#e7ddc6',dune:'#d8a94f',volcanic:TOKENS.vermilion,storm:TOKENS.lapis}[family];
  g.save();g.beginPath();g.arc(cx,cy,r*.97,0,TAU);g.clip();
  g.fillStyle=fill;g.fillRect(cx-r,cy-r,r*2,r*2);
  g.globalAlpha=.9;
  if(family==='crater'){ // small dark contour circles, tessellation logic not impact geology
    for(let i=0;i<9;i++){const a=rng()*TAU,d=rng()*r*.8,cr=r*(.08+rng()*.16);
      reedArc(g,cx+Math.cos(a)*d,cy+Math.sin(a)*d,cr,0,TAU,'110,84,46',.7,.8,seed+20+i,{segments:12,wobble:.15});}
  }else if(family==='ringed'){ // one or two concentric gold bands inside the rim
    reedArc(g,cx,cy,r*.68,0,TAU,'212,175,55',.95,r*.09,seed+21,{segments:20,wobble:.1});
    reedArc(g,cx,cy,r*.42,0,TAU,'212,175,55',.7,r*.05,seed+22,{segments:16,wobble:.1});
  }else if(family==='ice'){ // pale ground, fine silver contour hatching
    for(let i=-8;i<8;i++){const y=cy+i*r*.13;reedSegment(g,cx-r,y,cx+r,y,'196,204,206',.4,.6,seed+23+i,{segments:14,wobble:.15});}
  }else if(family==='dune'){ // repeating chevron/wave interlace, warm ochre
    for(let i=-6;i<6;i++){const y=cy+i*r*.17,amp=r*.14;
      const pts=[];for(let t=-1;t<=1.01;t+=.2)pts.push([cx+t*r,y+Math.sin(t*6+i)*amp]);
      reedPath(g,pts,false,'150,100,32',.55,.8,seed+24+i);}
  }else if(family==='volcanic'){ // pattern crowded hard to one edge
    for(let i=0;i<26;i++){const a=rng()*TAU,d=r*(.55+rng()*.4)*(.6+.4*Math.max(0,Math.sin(a)));
      reedSegment(g,cx+Math.cos(a)*d*.5,cy+Math.sin(a)*d*.5,cx+Math.cos(a)*d,cy+Math.sin(a)*d,'90,26,18',.55,.7,seed+25+i,{segments:3});}
  }else if(family==='storm'){ // densest interlace, indigo-on-lapis, near illegible
    for(let i=0;i<48;i++){const a=rng()*TAU,r0=rng()*r*.9,r1=r0+r*.22;
      reedArc(g,cx,cy,r0,a,a+.9+rng()*.6,'20,20,70',.5,.9,seed+26+i,{segments:5,wobble:.2});}
  } // ocean: plain lapis disc, deliberately unornamented
  g.globalAlpha=1;g.restore();
  // a thin shadow just inside the leaf, where a burnished gold rim always catches a dark
  // reflection against its own disc — the one bit of "modelling" this flat-colour grammar
  // permits itself, because it belongs to the metal, not the figure (ART-CRITIQUE.md #3/#6)
  reedArc(g,cx,cy,r*.9,0,TAU,'40,28,14',.22,r*.05,seed+9,{segments:18,wobble:.1});
  reedArc(g,cx,cy,r*.985,0,TAU,'52,38,20',.9,1,seed+2,{segments:26,wobble:.15}); // fine dark contour
  reedArc(g,cx,cy,r*1.06,0,TAU,'212,175,55',.95,r*.1,seed+3,{segments:24,wobble:.12}); // burnished gold rim
  reedArc(g,cx,cy,r*1.1,0,TAU,'160,120,50',.5,r*.02,seed+10,{segments:20,wobble:.08}); // the rim's own outer thread, a second pass of the leaf
}

// ---------- the four dangers (research §7) ----------
function paintHazard(g,cx,cy,r,kind,seed){
  const rng=mulberry32(seed);
  if(kind==='attractor'){ // raʾs al-tinnīn, "the head of the dragon" — chosen over al-Ghūl per research
    g.save();g.strokeStyle='rgba(36,28,17,.85)';
    const pts=[];for(let t=0;t<=1.001;t+=.04){const a=t*TAU*1.7;pts.push([cx+Math.cos(a)*r*(1-t*.6),cy+Math.sin(a)*r*(1-t*.6)]);}
    reedPath(g,pts,false,'27,63,143',.85,2.2,seed+1); // coiled body, lapis
    for(let i=0;i<pts.length;i+=3){const [x,y]=pts[i];reedArc(g,x,y,1.6,0,TAU,'27,63,143',.4,.6,seed+i);}
    const hx=cx,hy=cy;
    g.fillStyle=TOKENS.vermilion;g.beginPath();g.ellipse(hx,hy,r*.34,r*.24,0,0,TAU);g.fill();
    reedArc(g,hx,hy,r*.34,0,TAU,'36,28,17',.9,1,seed+2,{segments:14,wobble:.12});
    for(let i=-1;i<=1;i+=2){reedSegment(g,hx+i*r*.1,hy-r*.16,hx+i*r*.22,hy-r*.4,'36,28,17',.8,1,seed+3+i,{segments:4});} // horns
    punchDot(g,hx-r*.1,hy-r*.03,r*.045,TOKENS.gold,'36,28,17',seed+9); // eye
    reedArc(g,cx,cy,r*.34,0,TAU,'227,66,52',.9,1.4,seed+4,{segments:16,wobble:.15}); // the drawn kill radius, legible
    g.restore();
  }else if(kind==='repulsor'){ // al-Shams' burning — gilt disc, radiating heat lines
    const core=r*.44;
    g.fillStyle=TOKENS.gold;g.beginPath();g.arc(cx,cy,core,0,TAU);g.fill();
    reedArc(g,cx,cy,core,0,TAU,'36,28,17',.9,1.2,seed+1,{segments:16,wobble:.12});
    for(let i=0;i<16;i++){const a=i/16*TAU,len=r*(.5+((i%3)*.18));
      reedSegment(g,cx+Math.cos(a)*core*1.05,cy+Math.sin(a)*core*1.05,cx+Math.cos(a)*(core+len),cy+Math.sin(a)*(core+len),'227,66,52',.8,1.1,seed+10+i,{segments:3});}
    reedArc(g,cx,cy,core*.94,0,TAU,'227,66,52',.85,1.6,seed+2,{segments:14,wobble:.1}); // lethal core, legible
  }else if(kind==='crosswind'){ // sammūm — the specific scorching desert wind, glossed al-rīḥ
    for(let i=0;i<5;i++){const y=cy-r*.5+i*r*.25,rng2=1+rng()*.4;
      const pts=[];for(let t=-1;t<=1.01;t+=.15)pts.push([cx+t*r*rng2,y+Math.sin(t*4+i)*r*.08]);
      reedPath(g,pts,false,'201,162,39',.7-i*.06,1.1,seed+30+i);}
    for(let i=0;i<10;i++){const a=rng()*TAU,d=rng()*r*.5;punchDot(g,cx+Math.cos(a)*d*3,cy+Math.sin(a)*d,1.1+rng(),'rgba(150,100,32,.5)',null,seed+40+i);} // sand grain
  }else{ // obscurer — al-shayʾ al-saḥābī, "the little cloud": name attested, drawing invented per research §7
    for(let i=0;i<70;i++){const a=rng()*TAU,d=rng()*r;
      punchDot(g,cx+Math.cos(a)*d,cy+Math.sin(a)*d*.7,.8+rng()*1.4,`rgba(60,50,34,${.05+rng()*.1})`,null,seed+50+i);}
    reedArc(g,cx,cy,r*.9,0,TAU,'60,50,34',.35,.6,seed+5,{ry:r*.62,segments:16,wobble:.2});
  }
}

// ---------- al-Jabbār, "the Giant" (Orion) — drawn twice, mirrored, exactly as al-Ṣūfī
// sets every figure so the globe view and sky view are never mistaken for each other
// (research §1–2). Flat colour fill, continuous ink contour, no shading; the three named
// stars sit ON the figure as gold discs, independent of the anatomy beneath them. ----------
function figurePoints(mirror){
  const s=mirror?-1:1,P=[[0,-92],[10*s,-84],[16*s,-60],[34*s,-70],[40*s,-40],[22*s,-18],[26*s,20],[18*s,64],[26*s,92],
    [8*s,92],[6*s,26],[0,4],[-6*s,26],[-8*s,92],[-26*s,92],[-18*s,64],[-26*s,20],[-22*s,-18],[-40*s,-40],[-34*s,-70],[-16*s,-60],[-10*s,-84]];
  return P;
}
function paintFigureHalf(g,cx,cy,scale,mirror,seed){
  const pts=figurePoints(mirror).map(([x,y])=>[cx+x*scale,cy+y*scale]);
  g.save();g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();
  g.fillStyle=TOKENS.vermilion;g.globalAlpha=.92;g.fill();g.globalAlpha=1;g.restore();
  reedPath(g,pts,true,'36,28,17',.92,1.15,seed,{pool:true}); // the contour's own start, where the reed first touched down
  const s=mirror?-1:1,headR=15*scale;
  g.fillStyle='#d8b98a';g.beginPath();g.arc(cx,cy+(-92)*scale,headR,0,TAU);g.fill();
  reedArc(g,cx,cy+(-92)*scale,headR,0,TAU,'36,28,17',.9,1,seed+1,{segments:14,wobble:.15});
  // sash — orpiment band with a verdigris hem, textile pattern doing the work shading would
  reedSegment(g,cx-30*scale*s,cy-6*scale,cx+30*scale*s,cy+2*scale,'244,196,48',.85,4*scale,seed+2,{segments:8,wobble:.2});
  for(let i=-2;i<=2;i++)reedSegment(g,cx+i*10*scale,cy+70*scale,cx+i*10*scale,cy+90*scale,'62,142,126',.6,1.2,seed+3+i,{segments:3});
  // raised arm and a curved blade — al-Jabbār's attribute in the manuscript tradition
  const hx=cx+40*scale*s,hy=cy-40*scale;
  reedSegment(g,cx+22*scale*s,cy-18*scale,hx,hy,'36,28,17',.9,2*scale,seed+4,{segments:6});
  reedArc(g,hx+6*scale*s,hy-10*scale,16*scale,mirror?2.8:-.4,mirror?4.6:1.4,'36,28,17',.9,1.6*scale,seed+5,{segments:10,wobble:.15});
  return {shoulder:[cx-26*scale*s,cy-18*scale],hand:[hx+10*scale*s,hy-14*scale],foot:[cx-22*scale*s,cy+90*scale]};
}
function paintFigure(g,cx,cy,gap,scale,seed,t){
  const left=paintFigureHalf(g,cx-gap,cy,scale,false,seed);
  reedSegment(g,cx,cy-scale*100,cx,cy+scale*100,'201,162,39',.55,.8,seed+8,{segments:20,wobble:.1});
  const right=paintFigureHalf(g,cx+gap,cy,scale,true,seed+50);
  const mags=[{p:left.shoulder,n:'يد الجوزاء',tr:'yad al-jawzāʾ · Betelgeuse',mag:1},
    {p:left.hand,n:'',tr:'',mag:2},
    {p:left.foot,n:'رجل الجوزاء',tr:'rijl al-jawzāʾ · Rigel',mag:1}];
  [left,right].forEach((F,fi)=>{
    [['shoulder',1],['hand',2],['foot',1]].forEach(([k,mag],i)=>{
      const [x,y]=F[k],r=3.6-mag*.5;
      punchDot(g,x,y,r,TOKENS.gold,'36,28,17',seed+100+fi*3+i);
      for(let m=0;m<mag;m++)punchDot(g,x+r*2.4+m*3.6,y,.9,TOKENS.shellGold,null,seed+200+fi*3+i+m); // magnitude marks beside the disc
    });
  });
  translitText(g,'yad al-jawzāʾ · Betelgeuse',left.shoulder[0]-8,left.shoulder[1]-8,10,{align:'right',rgb:'80,64,40'});
  translitText(g,'rijl al-jawzāʾ · Rigel',left.foot[0]-8,left.foot[1]+16,10,{align:'right',rgb:'80,64,40'});
}

// ---------- pickups (research names them only by extension; flagged constructed) ----------
function paintPickup(g,cx,cy,kind,seed){
  const r=13;
  if(kind==='sling'){g.fillStyle=TOKENS.gold;g.beginPath();g.arc(cx,cy,r*.6,0,TAU);g.fill();
    reedArc(g,cx,cy,r,.3,TAU-.3,'212,175,55',.9,1.4,seed,{segments:12,wobble:.15});}
  else if(kind==='shield'){const pts=[[0,-r],[r*.85,-r*.2],[r*.6,r*.9],[0,r*.6],[-r*.6,r*.9],[-r*.85,-r*.2]].map(([x,y])=>[cx+x,cy+y]);
    g.fillStyle=TOKENS.verdigris;g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();g.fill();reedPath(g,pts,true,'36,28,17',.9,1,seed);}
  else if(kind==='reflector'){reedArc(g,cx,cy,r,.2,Math.PI-.2,'168,60,120',.9,2,seed,{segments:10,wobble:.15});
    reedSegment(g,cx-r,cy,cx-r*.4,cy-r*.4,'168,60,120',.9,1.6,seed+1);reedSegment(g,cx-r,cy,cx-r*.4,cy+r*.2,'168,60,120',.9,1.6,seed+2);}
  else{g.fillStyle=TOKENS.ink;g.beginPath();g.ellipse(cx,cy,r*.8,r*.6,0,0,TAU);g.fill();reedArc(g,cx,cy,r*.8,0,TAU,'36,28,17',.9,1,seed,{ry:r*.6,segments:12});}
}

// ---------- reveal: the qalam writes right-to-left, clip growing from the right, the
// dots (iʿjām) landing after the run — research §4's two-pass rhythm made literal ----------
function paintReveal(g,text,tr,xRight,y,size,t){
  const run=clamp(t/.72,0,1),dotPhase=clamp((t-.72)/.28,0,1);
  // The clip box must match the glyphs actually drawn, not a guessed width — a naskh run's
  // measured width and a per-character estimate disagree enough to clip real Amiri to
  // nothing, so real text is measured via the canvas itself; the fallback keeps its own
  // formula, since fakeNaskh's drawn width never matches font metrics either.
  let w;
  if(amiriReady){g.save();g.direction='rtl';g.font=faceFor(size,'ar','700');w=g.measureText(text).width;g.restore();}
  else w=size*.58*clamp(Math.round(text.replace(/\s/g,'').length*.55),3,10);
  g.save();g.beginPath();g.rect(xRight-w-6,y-size*1.4,w*run+10,size*1.9);g.clip();
  if(amiriReady){g.direction='rtl';g.textAlign='right';g.font=faceFor(size,'ar','700');g.fillStyle='rgba(36,28,17,1)';g.fillText(text,xRight,y);}
  else fakeNaskh(g,text,xRight,y,size,'36,28,17',1,909);
  g.restore();
  if(dotPhase>0){ // dots only after the joined skeleton is fully laid, per the two-pass rhythm
    g.save();g.globalAlpha=dotPhase;
    for(let i=0;i<5;i++)punchDot(g,xRight-w*(.15+i*.16),y+size*.28,size*.045,'36,28,17',null,910+i);
    g.restore();
  }
  const nibX=xRight-w*run;
  if(t<.72){reedArc(g,nibX,y-size*.18,2.6,0,TAU,'201,162,39',.9,1,912+Math.floor(t*90));} // the reed's own tip, leading the stroke
  translitText(g,tr,xRight,y+size*.62,11,{align:'right',rgb:'80,64,40',alpha:.85});
}

// ---------- the player: the comet (al-mudhannab, "the tailed one" — the standard modern
// word, applied here per the pickup-naming note above) on an orbit ring, live each frame ----------
function paintPlayer(g,cx,cy,r,t,nextX,nextY){
  reedArc(g,cx,cy,r,0,TAU,'52,38,20',.6,1.1,600,{segments:28,wobble:.12,pool:true}); // the orbit ring itself, plainly outside the body's gold rim
  const toNext=Math.atan2(nextY-cy,nextX-cx);
  reedArc(g,cx,cy,r,toNext-.5,toNext+.5,'201,162,39',.85,1.6,601,{segments:10,wobble:.1}); // the next-orbit aim guide, brightened toward the next body
  g.save();g.setLineDash([3,5]);g.globalAlpha=.5;
  reedSegment(g,cx+r*Math.cos(toNext),cy+r*Math.sin(toNext),nextX,nextY,'201,162,39',.7,.9,602,{segments:10,wobble:.2});
  g.restore();
  const a=t*.9,px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r;
  for(let i=1;i<=8;i++){const ta=a-i*.11,tx=cx+Math.cos(ta)*r,ty=cy+Math.sin(ta)*r;
    punchDot(g,tx,ty,2.2*(1-i/10),`rgba(227,66,52,${.55*(1-i/9)})`,null,700+i);} // the trailing flight path, rubrication-red
  punchDot(g,px,py,4.2,TOKENS.gold,'36,28,17',701); // the comet itself
}

// ---------- legend ----------
const LEGEND=[];
function legend(x,y,label){LEGEND.push({x,y,label})}
function drawLegend(g){
  g.save();g.font='11px Georgia, serif';g.fillStyle='rgba(40,40,40,.85)';g.textAlign='left';
  LEGEND.forEach(L=>{g.strokeStyle='rgba(40,40,40,.5)';g.lineWidth=1;g.beginPath();g.arc(L.x,L.y,3,0,TAU);g.stroke();
    g.fillText(L.label,L.x+7,L.y+4);});
  g.restore();
}

const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');

let bodyPos=[],hazardPos=[],pickupPos=[],playerNode=null,nextNode=null;

function layout(){
  bodyPos=[];hazardPos=[];pickupPos=[];LEGEND.length=0;
  const y=210,x0=150,dx=(1130-150)/6;
  FAMILIES.forEach((f,i)=>bodyPos.push({x:x0+i*dx,y,r:46,f}));
  playerNode=bodyPos[2];nextNode=bodyPos[3]; // comet plays the ringed world, aims at the next
  const hy=352,hx0=190,hdx=(1090-190)/3;

  sheet.width=W;sheet.height=H;

  pickupPos.forEach((p,i)=>{paintPickup(sctx,p.x,p.y,p.k,600+i*11);

    legend(p.x,p.y,pickGame[p.k]);
  });
  translitText(sctx,'sheet 1 · al-Jabbār',64,700,12,{align:'left',rgb:'60,48,30'});
  arabicText(sctx,NAMES.sheet+' ١ · '+NAMES.chapter+' ١',260,700,14,{align:'right',seed:22});
  // colophon + brass vignette. The roundel's own word is set in kufic — the era's carved,

  layoutFigureAndLegend();
}
let figureCenter={x:0,y:0,gap:0,scale:0};
function layoutFigureAndLegend(){
  figureCenter={x:640,y:560,gap:105,scale:.72};
  legend(figureCenter.x-figureCenter.gap,figureCenter.y,'constellation figure (sky view)');
  legend(figureCenter.x+figureCenter.gap,figureCenter.y,'constellation figure (mirrored globe view)');
}

function drawFrame(now){
  const t=(now-startTime)/1000;
  ctx.clearRect(0,0,W,H);
  ctx.drawImage(sheet,0,0);
  // constellation figure — flat colour + contour is cheap enough to redraw live (only the
  // reveal caption and the comet truly need to be separated from the static bake)
  paintFigure(ctx,figureCenter.x,figureCenter.y,figureCenter.gap,figureCenter.scale,55,t);
  const revealT=(t%6)/6;
  paintReveal(ctx,'الجبّار',"al-Jabbār · Orion, “the Giant”",figureCenter.x,figureCenter.y+118,26,revealT);
  paintHUDDynamic(ctx,W,H,{score:Math.round(61+Math.sin(t*.3)*4),best:61,speed:1+.15*Math.sin(t*.5),flow:3,ink:.62+.15*Math.sin(t*.7)});
  paintPlayer(ctx,playerNode.x,playerNode.y,playerNode.r+22,t,nextNode.x,nextNode.y);
  if(legendOn)drawLegend(ctx);
  requestAnimationFrame(drawFrame);
}

function fitCanvas(){
  const vw=window.innerWidth,vh=window.innerHeight,scale=Math.min(vw/W,vh/H,1)*0.98;
  const dpr=window.devicePixelRatio||1;
  canvas.style.width=(W*scale)+'px';canvas.style.height=(H*scale)+'px';
  canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize',fitCanvas);
window.addEventListener('keydown',e=>{if(e.key==='l'||e.key==='L')legendOn=!legendOn;});

function boot(){
  layout();buildSheet();fitCanvas();
  requestAnimationFrame(drawFrame);
}
// The faces are now local files (fonts/amiri.ttf, fonts/reem-kufi.ttf) — no network race is
// needed. document.fonts.ready is awaited so the very first paint already sets in the real
// hand; document.fonts.check() afterward is the genuine pass/fail (font truly missing or
// corrupt), not a network timeout guess, and only that failure reaches the qalam-squiggle.
async function boot_fonts(){
  let ok=true;
  try{
    if(document.fonts&&document.fonts.load){
      await Promise.all([
        document.fonts.load('700 40px Amiri','فلك'),
        document.fonts.load('400 16px Amiri','بحر'),
        document.fonts.load('400 20px "Reem Kufi"','نسخة')
      ]);
      await document.fonts.ready;
    }
  }catch(e){ok=false}
  amiriReady=!!(document.fonts&&document.fonts.check('700 16px Amiri'));
  reemReady=!!(document.fonts&&document.fonts.check('400 16px "Reem Kufi"'));
  boot();
}
boot_fonts();
</script>
