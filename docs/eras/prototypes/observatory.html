<!doctype html>
<!--
  Orbit — era VII prototype: THE OBSERVATORY (1990–today).
  Built from docs/eras/research/observatory.md; every named mark below cites a section of it.
  Not shipped code — a standalone sheet for judging the era before any porting into src/.

  Fonts (both SIL Open Font License 1.1 — embeddable the way the game's Fell faces already are;
  research.md §4 names both explicitly), loaded from the local full-face copies this prototype
  folder keeps beside itself (fonts/README.md) rather than from Google's CDN, so the sheet
  paints correctly with no network at all — the game would ship them cut to its own charset via
  `npm run fonts`, exactly as the Fell types are cut today:
    - IBM Plex Mono (IBM, 2017) — the FITS-card face.
    - Space Grotesk (Florian Karsten, 2018, cut from Colophon Foundry's Space Mono) — the
      margin/small-caps face, "instrument label" register per research.md §4.
  If a face fails to parse the font-family fallback stacks below land on the platform's own
  monospace/grotesque rather than Times New Roman, so the sheet still reads as an instrument,
  only in a house face instead of the named one.
-->
<html>
<head>
<meta charset="utf-8">
<title>Orbit — The Observatory</title>
<style>
  @font-face{font-family:'IBM Plex Mono';src:url('fonts/ibm-plex-mono.ttf') format('truetype');font-weight:400 600;font-display:block;}
  @font-face{font-family:'Space Grotesk';src:url('fonts/space-grotesk.ttf') format('truetype');font-weight:400 600;font-display:block;}
  html,body{margin:0;padding:0;background:#000;height:100%;overflow:hidden;}
  #stage{width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
  canvas{display:block;image-rendering:auto;}
  #hint{position:fixed;left:8px;bottom:6px;color:#5a6a78;font:11px monospace;opacity:.6;pointer-events:none;}
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="hint">L — legend</div>
<script>
'use strict';
/* ---------- seeded randomness: the sheet must paint the same way every load ---------- */
function mulberry32(seed){
  let a=seed>>>0;
  return function(){
    a|=0;a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
const SEED=0xC0DE07;

/* ---------- tokens: the plate's palette and faces, named exactly as definePlate would ---------- */
const TOKENS={
  ground:'#04060b',                       // sensor black, research.md §3 — already shipped in backdrop.js
  airglow:'rgba(24,38,60,.5)',
  ink:'#eef4fb', inkDim:'rgba(233,242,250,.6)', inkFaint:'rgba(233,242,250,.32)',
  cyan:'#8fd6e8', gold:'#f5c542', amber:'#ff8c3c',
  sii:'#e8482f', ha:'#39c46a', oiii:'#3aa0e8',                    // research.md §3, the Hubble-palette assignment
  attractor:'#ff8c3c', repulsor:'#f0e4c8', repulsorCore:'#050403', wind:'#e7d9a8', dust:'#0a0c14',
  keyline:'rgba(233,242,250,.4)',
  legend:'rgba(150,190,210,.85)',
  mono:'"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace',
  sc:'"Space Grotesk",ui-sans-serif,system-ui,sans-serif'
};
// One sun direction for the whole sheet — every lit body reads its terminator off this same
// vector, so the specimen row looks like one case of worlds under one lamp, not seven poses.
const SUN_DIR={x:-0.66,y:-0.75};
// Body palettes: the exact hex the shipped `modern` plate token already registers
// (src/planets.js PLATES.modern) — reused rather than re-invented, per this era's own rule
// that a rendered world keeps its true colour instead of a plate tint.
const BODY={
  ocean:   {light:'#a8d4ee',body:'#2f6494',dark:'#08182c',rgb:'116,178,226',air:1,   spec:true},
  crater:  {light:'#e0dacb',body:'#8c8779',dark:'#211f1b',rgb:'196,190,178',air:0,   spec:false},
  ringed:  {light:'#f2debb',body:'#c6a670',dark:'#3a2c17',rgb:'230,204,158',air:.88, spec:false,ring:true},
  ice:     {light:'#eef7fc',body:'#9dc3d6',dark:'#1e3644',rgb:'196,226,242',air:.72, spec:true},
  dune:    {light:'#eeb488',body:'#ac6539',dark:'#341a0d',rgb:'218,142,94', air:.4,  spec:false},
  volcanic:{light:'#d0774a',body:'#4c3b33',dark:'#140c09',rgb:'214,100,52', air:.22, spec:false},
  storm:   {light:'#f0dfc8',body:'#bf9e80',dark:'#3c2c20',rgb:'226,198,168',air:1,   spec:false}
};
// Names for the game's things, research.md §5 — attested where the table marks it so.
const FAMILY_NAME={ocean:'OCEAN WORLD',crater:'ROCKY WORLD',ringed:'GAS GIANT',ice:'ICE GIANT',
  dune:'DESERT WORLD',volcanic:'LAVA WORLD',storm:'STORM-BAND GIANT'};
const FAMILY_ORDER=['ocean','crater','ringed','ice','dune','volcanic','storm'];

/* ---------- canvas / DPR / fit-to-window, keeping the 1280x800 aspect ---------- */
const BASE_W=1280,BASE_H=800;
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let DPR=1;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  const scale=Math.min(window.innerWidth/BASE_W,window.innerHeight/BASE_H);
  canvas.style.width=Math.round(BASE_W*scale)+'px';
  canvas.style.height=Math.round(BASE_H*scale)+'px';
  canvas.width=Math.round(BASE_W*DPR);
  canvas.height=Math.round(BASE_H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  staticLayer=null; // force a rebuild at the new pixel density
}
window.addEventListener('resize',resize);

function makeLayer(){
  const c=document.createElement('canvas');
  c.width=Math.round(BASE_W*DPR);c.height=Math.round(BASE_H*DPR);
  const g=c.getContext('2d');g.setTransform(DPR,0,0,DPR,0,0);
  return {c,g};
}

/* ==========================================================================================
   THE ERA'S STROKE PRIMITIVES — every mark on this sheet is cut by one of these three, never
   a raw ctx.stroke()/ctx.fillRect(), exactly as the engraving era routes every line through
   burinArc/burinSegment. A FITS-era sheet has no hand in it at all (research.md §4: "a machine
   wrote it"), so the primitives are deliberately inert — no wobble, no taper, no lifted tool.
   ========================================================================================== */
// hairline() — the instrument's straight or dashed rule: scale-bar ticks, the compass arrows,
// a body's keyline, a ring's outline, the colour-bar frame, a pointer line.
function hairline(g,x1,y1,x2,y2,{color=TOKENS.inkDim,width=1,dash=null,alpha=1}={}){
  g.save();g.globalAlpha=alpha;g.strokeStyle=color;g.lineWidth=width;g.lineCap='butt';
  if(dash)g.setLineDash(dash);
  g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();
  g.restore();
}
// hairArc() — an arc built from short hairline chords, for orbit rings, the black hole's
// photon ring and every other curve on the sheet; nothing here is a single smooth ctx.arc().
function hairArc(g,cx,cy,r,a0,a1,opts={},steps=null){
  const n=steps||Math.max(6,Math.ceil(Math.abs(a1-a0)/0.09));
  let px=cx+Math.cos(a0)*r,py=cy+Math.sin(a0)*r;
  for(let i=1;i<=n;i++){
    const a=a0+(a1-a0)*i/n,x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;
    hairline(g,px,py,x,y,opts);px=x;py=y;
  }
}
// punchDot() — the sensor's photosite: every star, every grain of read noise, every fleck of
// surface texture on a body is one square well of light, never a round painterly daub.
function punchDot(g,x,y,r,color,alpha=1){
  g.save();g.globalAlpha=alpha;g.fillStyle=color;g.fillRect(x-r,y-r,r*2,r*2);g.restore();
}
// plotterSegment() — a line an instrument is actively drawing rather than one already cut: the
// dash offset advances with t, so the flight trail, the aim guide and the pointer line all read
// as telemetry being plotted live instead of ink already dry.
function plotterSegment(g,x1,y1,x2,y2,t,{color=TOKENS.cyan,width=1.2,period=14,alpha=.8}={}){
  g.save();g.globalAlpha=alpha;g.strokeStyle=color;g.lineWidth=width;
  g.setLineDash([3,4]);g.lineDashOffset=-t*period;
  g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();g.restore();
}

/* ---------- text: the FITS card and the small-caps margin label ---------- */
function monoFont(px,weight=400,italic=false){return `${italic?'italic ':''}${weight} ${px}px ${TOKENS.mono}`;}
function scFont(px,weight=500){return `${weight} ${px}px ${TOKENS.sc}`;}
function label(g,text,x,y,{font=scFont(10),color=TOKENS.inkDim,align='left',tracking=1.4,alpha=1}={}){
  g.save();g.globalAlpha=alpha;g.font=font;g.fillStyle=color;g.textBaseline='alphabetic';
  if(tracking<=0||text.length<2){g.textAlign=align;g.fillText(text,x,y);g.restore();return;}
  // Letter-spacing by hand: canvas has no tracking property, and this era's captions are set wide.
  const widths=[...text].map(ch=>g.measureText(ch).width);
  const total=widths.reduce((a,b)=>a+b,0)+tracking*(text.length-1);
  let cx=align==='right'?x-total:align==='center'?x-total/2:x;
  g.textAlign='left';
  for(let i=0;i<text.length;i++){g.fillText(text[i],cx,y);cx+=widths[i]+tracking;}
  g.restore();
}
// A right-padded FITS card: an 8-char keyword, ' = ', the value, and an optional ' / comment' —
// research.md §4's fixed-width convention, set literally rather than paraphrased.
function fitsCard(kw,val,comment){
  const k=(kw+'        ').slice(0,8);
  return comment?`${k}= ${val} / ${comment}`:`${k}= ${val}`;
}

/* ==========================================================================================
   THE GROUND — a sensor, not a sheet: airglow, a false-colour narrowband patch, a dust lane,
   a graded star field with bloom and diffraction spikes, read noise. Cached once; this whole
   layer never changes frame to frame.
   ========================================================================================== */
function paintGround(g,rng){
  const far=Math.max(BASE_W,BASE_H);
  g.fillStyle=TOKENS.ground;g.fillRect(0,0,BASE_W,BASE_H);
  const glow=g.createRadialGradient(BASE_W*.52,BASE_H*.42,0,BASE_W*.5,BASE_H*.5,far*.8);
  glow.addColorStop(0,TOKENS.airglow);glow.addColorStop(.55,'rgba(12,20,34,.3)');glow.addColorStop(1,'rgba(3,5,10,0)');
  g.fillStyle=glow;g.fillRect(0,0,BASE_W,BASE_H);
  // The narrowband patch, in the amber-teal a real SII/Hα/OIII composite reads as (§3: SII and
  // Hα both register across most of a real nebula, so a pure-primary mix would be wrong).
  const nebX=560,nebY=195;
  for(let i=0;i<14;i++){
    const ox=nebX+(rng()-.5)*190,oy=nebY+(rng()-.5)*130,rr=40+rng()*70;
    const mix=rng();const c=mix<.4?TOKENS.sii:mix<.75?TOKENS.ha:TOKENS.oiii;
    const rgb=c===TOKENS.sii?'232,72,47':c===TOKENS.ha?'57,196,106':'58,160,232';
    const glowN=g.createRadialGradient(ox,oy,0,ox,oy,rr);
    glowN.addColorStop(0,`rgba(${rgb},${.05+rng()*.06})`);glowN.addColorStop(.6,`rgba(${rgb},${.02+rng()*.02})`);glowN.addColorStop(1,`rgba(${rgb},0)`);
    g.fillStyle=glowN;g.fillRect(ox-rr,oy-rr,rr*2,rr*2);
  }
  // Pillars: dark silhouette columns rising out of the same patch, the dust the light hasn't
  // eaten through yet (1995/2014 Hubble grammar, §1).
  g.save();g.globalAlpha=.5;
  for(let i=0;i<3;i++){
    const bx=nebX-70+i*55,bw=20+rng()*10;
    g.fillStyle='rgba(6,5,8,.6)';
    g.beginPath();g.moveTo(bx-bw/2,nebY+90);g.lineTo(bx-bw*.2,nebY-40-rng()*20);g.lineTo(bx+bw*.15,nebY-40-rng()*20);g.lineTo(bx+bw/2,nebY+90);g.closePath();g.fill();
  }
  g.restore();
  // One deliberate dust lane in the foreground, dark enough to caption (obscurer, §7/§8: "the
  // modern-era equivalent of era IV's Barnard numbers" — an LDN-style number).
  const laneX=430,laneY=500;
  g.save();g.translate(laneX,laneY);g.rotate(-.3);
  const lane=g.createRadialGradient(0,0,0,0,0,1);
  lane.addColorStop(0,'rgba(4,5,10,.6)');lane.addColorStop(.6,'rgba(4,5,10,.28)');lane.addColorStop(1,'rgba(4,5,10,0)');
  g.scale(150,34);g.fillStyle=lane;g.fillRect(-1,-1,2,2);
  g.restore();
  window.__laneCaptionAt={x:laneX+70,y:laneY+38};
  // The field. Most of it unresolved single photosites, thicker through a faint galactic band.
  g.save();g.translate(BASE_W*.5,BASE_H*.52);g.rotate(-.5);
  for(let i=0;i<2600;i++){
    const x=(rng()-.5)*far*2,y=(rng()+rng()+rng()-1.5)*BASE_H*.55;
    punchDot(g,x,y,.5+rng()*.4,rng()<.3?'rgba(196,214,244,1)':'rgba(232,238,246,1)',.06+rng()*.3);
  }
  g.restore();
  for(let i=0;i<420;i++)punchDot(g,rng()*BASE_W,rng()*BASE_H,.6,'rgba(226,236,248,1)',.05+rng()*.28);
  // Bright stars: bloom, and the instrument's own signature — four vanes on most, six (a
  // hexagonal-segment mirror's mark, research.md §12's noted gap) on the very brightest few.
  for(let i=0;i<70;i++){
    const x=rng()*BASE_W,y=rng()*BASE_H*.72,mag=rng(),r=.7+mag*mag*2.4;
    const tone=mag>.86?'255,224,190':mag>.6?'246,246,242':'202,222,255';
    const halo=g.createRadialGradient(x,y,0,x,y,r*7);
    halo.addColorStop(0,`rgba(${tone},${.2+mag*.32})`);halo.addColorStop(.32,`rgba(${tone},${.05+mag*.1})`);halo.addColorStop(1,`rgba(${tone},0)`);
    g.fillStyle=halo;g.fillRect(x-r*7,y-r*7,r*14,r*14);
    punchDot(g,x,y,r*.62,'#fff',.55+mag*.45);
    if(mag>.9){
      const reach=r*10;
      for(let s=0;s<6;s++){const a=s*Math.PI/3;hairline(g,x-Math.cos(a)*reach,y-Math.sin(a)*reach,x+Math.cos(a)*reach,y+Math.sin(a)*reach,{color:`rgba(${tone},.16)`,width:.5});}
    }else if(mag>.72){
      const reach=r*(5+mag*6);
      hairline(g,x-reach,y,x+reach,y,{color:`rgba(${tone},.16)`,width:.55});
      hairline(g,x,y-reach,x,y+reach,{color:`rgba(${tone},.16)`,width:.55});
    }
  }
  // Read noise: a fine, near-invisible speckle over the whole frame, the sensor's own grain.
  for(let i=0;i<900;i++)punchDot(g,rng()*BASE_W,rng()*BASE_H,.5,'rgba(255,255,255,1)',rng()*.04);
  const vign=g.createRadialGradient(BASE_W*.5,BASE_H*.46,Math.min(BASE_W,BASE_H)*.26,BASE_W*.5,BASE_H*.5,far*.72);
  vign.addColorStop(0,'rgba(2,4,9,0)');vign.addColorStop(1,'rgba(1,2,6,.66)');
  g.fillStyle=vign;g.fillRect(0,0,BASE_W,BASE_H);
}

/* ==========================================================================================
   BODIES — lit spheres. albedo() paints the turning surface; lightBody() lays the terminator,
   limb darkening, rim and specular over it — the split research.md's §"how the seven families
   are depicted" describes as back/surface/front/weather, collapsed here to two passes since
   nothing on this static sheet actually turns.
   ========================================================================================== */
function albedo(g,r,family,rng){
  const pal=BODY[family];
  g.save();g.beginPath();g.arc(0,0,r,0,Math.PI*2);g.clip();
  g.fillStyle=pal.body;g.fillRect(-r,-r,r*2,r*2);
  if(family==='ocean'){
    for(let i=0;i<5;i++){const x=(rng()-.5)*r*1.6,y=(rng()-.5)*r*1.6,rr=r*(.14+rng()*.26);
      const c=g.createRadialGradient(x,y,0,x,y,rr);c.addColorStop(0,'rgba(120,140,90,.55)');c.addColorStop(1,'rgba(120,140,90,0)');
      g.fillStyle=c;g.fillRect(x-rr,y-rr,rr*2,rr*2);}
    for(let i=0;i<50;i++)punchDot(g,(rng()-.5)*r*2,(rng()-.5)*r*2,.5+rng(),'rgba(255,255,255,1)',rng()*.12);
  }else if(family==='crater'){
    for(let i=0;i<24;i++){const a=rng()*Math.PI*2,d=Math.sqrt(rng())*r*.95,x=Math.cos(a)*d,y=Math.sin(a)*d,rr=r*(.03+rng()*.1);
      g.fillStyle=`rgba(30,28,24,${.14+rng()*.18})`;g.beginPath();g.arc(x,y,rr,0,Math.PI*2);g.fill();
      hairline(g,x-rr*.7,y-rr*.7,x+rr*.7,y+rr*.7,{color:'rgba(220,214,200,.18)',width:.4});}
  }else if(family==='ringed'||family==='storm'){
    const bands=family==='storm'?11:7;
    for(let i=0;i<bands;i++){const y=-r+i*r*2/bands,h=r*2/bands;
      g.fillStyle=i%2?`rgba(${pal.rgb},.22)`:`rgba(${pal.rgb},.06)`;g.fillRect(-r,y,r*2,h);}
    if(family==='storm'){ // the Great Red Spot, bright in infrared rather than red — research.md §8
      const sx=-r*.15,sy=r*.1;const spot=g.createRadialGradient(sx,sy,0,sx,sy,r*.32);
      spot.addColorStop(0,'rgba(255,244,220,.55)');spot.addColorStop(1,'rgba(255,244,220,0)');
      g.fillStyle=spot;g.fillRect(sx-r*.32,sy-r*.32,r*.64,r*.64);
    }
  }else if(family==='ice'){
    for(let i=0;i<10;i++){const a=rng()*Math.PI*2,d=(rng()-.5)*r*1.1;
      hairline(g,Math.cos(a)*r,Math.sin(a)*r+d,-Math.cos(a)*r,-Math.sin(a)*r+d,{color:`rgba(${pal.rgb},.14)`,width:.4});}
  }else if(family==='dune'){
    for(let i=0;i<9;i++){const y=-r+i*r*2/9;g.fillStyle=`rgba(60,28,14,${.1+rng()*.1})`;g.fillRect(-r,y,r*2,r*2/9*.5);}
    hairline(g,-r*.7,r*.1,r*.75,-r*.05,{color:'rgba(50,22,10,.4)',width:r*.05});
  }else if(family==='volcanic'){
    for(let i=0;i<7;i++){const x=(rng()-.5)*r*1.4,y=(rng()-.5)*r*1.4,rr=r*(.06+rng()*.13);
      const c=g.createRadialGradient(x,y,0,x,y,rr);c.addColorStop(0,'rgba(255,196,120,.7)');c.addColorStop(.5,'rgba(226,96,36,.4)');c.addColorStop(1,'rgba(226,96,36,0)');
      g.fillStyle=c;g.fillRect(x-rr,y-rr,rr*2,rr*2);}
  }
  g.restore();
}
function lightBody(g,r,family,rng){
  const pal=BODY[family];
  // One sun for the whole sheet: every body is lit from this same direction, so the row reads as
  // one specimen case under one lamp rather than seven separately-posed renders.
  const nx=SUN_DIR.x,ny=SUN_DIR.y,lx=r*nx*.55,ly=r*ny*.55;
  g.save();g.beginPath();g.arc(0,0,r,0,Math.PI*2);g.clip();
  // The terminator itself: a gradient run straight along the sun axis is the cheap-and-correct
  // fake for a sphere's cosine falloff — it puts a clean, sun-relative line between the lit
  // hemisphere and the dark one instead of a vague overall vignette. An airless world's line is a
  // knife-edge; an atmosphere scatters light a little way past it, so the edge softens with air.
  const soft=.05+pal.air*.24;
  const term=g.createLinearGradient(r*nx,r*ny,-r*nx,-r*ny);
  term.addColorStop(0,'rgba(0,0,0,0)');
  term.addColorStop(Math.max(0,.5-soft),'rgba(0,0,0,0)');
  term.addColorStop(.5,'rgba(2,4,10,.52)');
  term.addColorStop(Math.min(1,.5+soft),'rgba(1,3,8,.84)');
  term.addColorStop(1,'rgba(0,1,4,.95)');
  g.fillStyle=term;g.fillRect(-r,-r,r*2,r*2);
  // Limb darkening proper: even the lit face loses light toward its own edge, all the way round.
  const limb=g.createRadialGradient(0,0,r*.5,0,0,r);
  limb.addColorStop(0,'rgba(0,0,0,0)');limb.addColorStop(1,`rgba(2,4,9,${.24+pal.air*.14})`);
  g.fillStyle=limb;g.fillRect(-r,-r,r*2,r*2);
  // The crescent of light caught right on the lit limb, brightest nearest the sun.
  const rim=g.createRadialGradient(lx*1.5,ly*1.5,0,lx*1.5,ly*1.5,r*1.35);
  rim.addColorStop(0,`rgba(${pal.rgb},${.55+pal.air*.35})`);rim.addColorStop(.45,`rgba(${pal.rgb},.1)`);rim.addColorStop(1,`rgba(${pal.rgb},0)`);
  g.fillStyle=rim;g.fillRect(-r,-r,r*2,r*2);
  if(pal.spec){
    const spec=g.createRadialGradient(lx*1.15,ly*1.15,0,lx*1.15,ly*1.15,r*.38);
    spec.addColorStop(0,'rgba(255,255,255,.5)');spec.addColorStop(.5,'rgba(255,255,255,.1)');spec.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=spec;g.fillRect(-r,-r,r*2,r*2);
  }
  if(pal.ring){ // the ring's own shadow on the globe — the clearest cue this is a sphere (§8)
    const shadow=g.createLinearGradient(0,-r*.42,0,r*.42);
    shadow.addColorStop(0,'rgba(0,0,0,0)');shadow.addColorStop(.45,'rgba(0,0,0,.4)');shadow.addColorStop(.55,'rgba(0,0,0,.4)');shadow.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=shadow;g.fillRect(-r,-r*.42,r*2,r*.84);
  }
  g.restore();
  if(pal.air>.05){
    const halo=g.createRadialGradient(0,0,r*.94,0,0,r*(1.1+pal.air*.24));
    halo.addColorStop(0,`rgba(${pal.rgb},${.28*pal.air})`);halo.addColorStop(.35,`rgba(${pal.rgb},${.12*pal.air})`);halo.addColorStop(1,`rgba(${pal.rgb},0)`);
    g.fillStyle=halo;g.beginPath();g.arc(0,0,r*(1.1+pal.air*.24),0,Math.PI*2);g.fill();
  }
}
function paintRingBack(g,r){ // the far half of the ring, behind the globe, drawn before it
  g.save();g.rotate(-.22);

  g.fillStyle=corona;g.beginPath();g.arc(0,0,r*1.9,0,Math.PI*2);g.fill();
  // CME: leading bright front, dark cavity, bright trailing core — LASCO's handbook structure.
  g.save();g.rotate(-.9);

let t0=performance.now();
function frame(now){
  const t=(now-t0)/1000;
  if(!staticLayer)buildStatic();
  ctx.clearRect(0,0,BASE_W,BASE_H);
  ctx.drawImage(staticLayer,0,0,BASE_W,BASE_H);
  paintProbe(ctx,t);
  paintHUDLive(ctx,t);
  if(showLegend)paintLegend(ctx);
  requestAnimationFrame(frame);
}
resize();
// Wait on the local faces before the first paint — nothing here is fetched over a network, so
// document.fonts.ready settles almost immediately; the timeout is only a guard against a face
// that fails to parse, so the sheet still starts rather than hanging on a broken font file.
const fontsSettled=document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve();
Promise.race([fontsSettled,new Promise(r=>setTimeout(r,800))]).then(()=>requestAnimationFrame(frame));
</script>
